<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오행의 집 GAME</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#2d2a3a;background:#20323a}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:#dfeeee url('assets/bg-sea.png') center/cover no-repeat}
.screen.on{display:flex}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;min-height:44px;background:#2d2a3a;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#2d2a3a;box-shadow:inset 0 0 0 2px #2d2a3a}
button:disabled{opacity:.4;cursor:default}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.7)}
.head h2{flex:1;font-size:17px}
.head button{padding:8px 12px;min-height:38px;font-size:13px}

/* 타이틀 */
#s-start{align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px}
.title-box{background:rgba(255,255,255,.6);border-radius:24px;padding:26px 22px;backdrop-filter:blur(2px)}
.logo{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.logo i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900}
#s-start h1{font-size:30px;font-weight:900}
#s-start p{font-size:14px;color:#4b4658;margin-top:6px}
#btnStart{font-size:18px;padding:16px 36px;background:#c0392b;margin-top:18px}

/* 섬 선택 */
.mapArea{flex:1;min-height:0;position:relative;overflow:hidden}
.stage{position:absolute;inset:0;margin:auto;width:100%;max-width:900px;aspect-ratio:1024/768;max-height:100%}
.isl{position:absolute;cursor:pointer;transition:transform .2s ease,filter .2s ease;transform-origin:50% 50%;touch-action:none}
.isl img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
.isl.big{transform:scale(1.18);z-index:5;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.isl.on{z-index:4;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28))}
.label{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;pointer-events:none;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.isl.on .label,.isl.big .label{background:#2d2a3a;color:#fff}
.infoBox{margin:0 12px;background:#fff;border-radius:16px;padding:12px 14px;min-height:96px;font-size:14px;line-height:1.55;color:#4b4658}
.infoBox h3{font-size:17px;color:#2d2a3a;margin-bottom:6px}
.foot{padding:12px}
.foot button{width:100%}
.modal{position:absolute;inset:0;background:rgba(20,16,30,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:18px;padding:22px 18px;text-align:center;max-width:340px;width:100%}
.modal p{font-size:16px;font-weight:800;margin-bottom:16px}
.modal .btns{display:flex;gap:10px}
.modal .btns button{flex:1}

/* 섬 화면 */
.wrapIsl{position:relative;flex:1;min-height:0;display:flex}
#cv{flex:1;width:100%;height:100%;display:block;touch-action:none}
#bubble{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff;padding:8px 14px;border-radius:12px;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.2);display:none;max-width:90%;text-align:center;pointer-events:none}
#islMsg{padding:10px 14px;font-size:13px;min-height:2.6em;line-height:1.4}
#s-island{background:#e8f3ef}

@media (min-width:800px){.infoBox{max-width:720px;margin:0 auto 12px;width:calc(100% - 24px)}}
</style>
</head>
<body>

<!-- 타이틀 -->
<section id="s-start" class="screen on">
  <div class="title-box">
    <div class="logo">
      <i style="background:#5fae6a">木</i><i style="background:#e8786a">火</i><i style="background:#c99a63">土</i>
      <i style="background:#9aa7b4">金</i><i style="background:#4d9fd6">水</i>
    </div>
    <h1>오행의 집 GAME</h1>
    <p>다섯 섬 중 하나에서 나만의 집을 꾸며보세요</p>
    <button id="btnStart">GAME START</button>
  </div>
</section>

<!-- 섬 선택 -->
<section id="s-select" class="screen">
  <div class="head">
    <button id="btnSelBack" class="ghost">←</button>
    <h2>섬 고르기</h2>
  </div>
  <div class="mapArea"><div class="stage" id="stage"></div></div>
  <div class="infoBox" id="info">섬을 누르면 지형과 집터 정보가 나와요.</div>
  <div class="foot"><button id="btnGo" disabled>이 섬에서 살기</button></div>
  <div class="modal" id="confirm">
    <div class="box">
      <p>이 섬으로 선택하겠습니까?</p>
      <div class="btns">
        <button id="btnYes">예</button>
        <button id="btnNo" class="ghost">아니오</button>
      </div>
    </div>
  </div>
</section>

<!-- 섬 화면 -->
<section id="s-island" class="screen">
  <div class="head">
    <button id="btnBack" class="ghost">← 섬 고르기</button>
    <h2 id="islName"></h2>
  </div>
  <div class="wrapIsl">
    <canvas id="cv"></canvas>
    <div id="bubble"></div>
  </div>
  <div id="islMsg"></div>
</section>

<script>
/* =====================================================
   1. DATA: 섬 정보
   bbox: 선택 화면(1024×768 기준)에서 섬 이미지가 놓일 위치
   img : 섬 개별 이미지 경로 (투명 배경 PNG)
   ===================================================== */
const MAP_W = 1024, MAP_H = 768;
const W = 12;
const TILE_NAMES = {'.':'땅','D':'선착장','=':'길','#':'바위','~':'물','':'바깥'};

const ISLANDS = [
  { id:'geum', el:'금', hanja:'金', name:'은빛봉우리 섬', img:'assets/islands/geum.png', color:'#c4ccd6', dark:'#5d6673', water:'#9fd0ea', path:'#dfe3e8',
    bbox:{x:285,y:20,w:420,h:220},
    terrain:'흰 바위 봉우리 세 개와 그 아래 펼쳐진 돌빛 평지',
    plots:'집터 3곳 (봉우리 아래 평지, 봉우리 사이, 돌빛 가장자리)',
    map:["############","#..........#","#.========.#","#.=......=.#","#D=......=.#","#.=......=.#","#.========.#","#..........#","############"]},
  { id:'hwa', el:'화', hanja:'火', name:'붉은절벽 섬', img:'assets/islands/hwa.png', color:'#d9906f', dark:'#4b3a3d', water:'#ff6b35', path:'#b8a08f',
    bbox:{x:15,y:195,w:305,h:310},
    terrain:'한쪽으로 길게 이어지는 붉은 절벽과 아래쪽의 따뜻한 빛깔 들판',
    plots:'집터 2곳 (절벽 위 전망 터, 들판 입구 터)',
    map:["   ####"," ##....##","#..D.....#","#.~~.....~#","#.~~..==..#","#.....====.#"," #..~~.....#"," #....=...#","  ###...##","    ###"]},
  { id:'to', el:'토', hanja:'土', name:'황금들판 섬', img:'assets/islands/to.png', color:'#e0b458', dark:'#7a5a33', water:'#8ec5e8', path:'#e8d6b0',
    bbox:{x:295,y:245,w:410,h:280},
    terrain:'뒤쪽의 둥근 언덕 두 개와 지도에서 가장 넓은 평원',
    plots:'집터 4곳 (평원 중심, 언덕 아래, 길가, 들판 끝)',
    map:["   ......"," ..........","...D=====...","...=.......#","....=....#..","..........=.","..###.....=.","...........#","  ....==....","    ...."]},
  { id:'su', el:'수', hanja:'水', name:'물굽이 섬', img:'assets/islands/su.png', color:'#8fc3c9', dark:'#2f6a4a', water:'#4d9fd6', path:'#e8d6b0',
    bbox:{x:700,y:200,w:310,h:320},
    terrain:'작은 만으로 이어지는 굽은 강과 강 안쪽의 넓은 풀밭',
    plots:'집터 2곳 (강가 터, 풀밭 터)',
    map:["  ####"," #.D.#~~~~","#.......~~~","#.....===...","#.....~~~...","#.....~~~...", " #....~~....","  ####  ~~"]},
  { id:'mok', el:'목', hanja:'木', name:'풀빛언덕 섬', img:'assets/islands/mok.png', color:'#a9d98f', dark:'#3f7a4a', water:'#7fbde0', path:'#e6d0a0',
    bbox:{x:215,y:520,w:555,h:230},
    terrain:'층층이 이어지는 낮은 언덕과 한가운데의 열린 들판',
    plots:'집터 3곳 (언덕 계단 터, 들판 터, 숲 가장자리 터)',
    map:["  ###   ###"," #..=....#","#...=.....#","#..D=......#","#.....====.#","#.....=....#","##....=..##"," #...=....#","  ###...##","     ###"]}
];

ISLANDS.forEach(isl => {
  isl.map = isl.map.map(r => r.padEnd(W, ' ').slice(0, W));
  isl.H = isl.map.length;
  isl.dock = findDock(isl);
});
function findDock(isl) {
  for (let y = 0; y < isl.H; y++) for (let x = 0; x < W; x++)
    if (isl.map[y][x] === 'D') return {x, y};
  return {x:1, y:1};
}

/* =====================================================
   2. STORE: localStorage
   ===================================================== */
const Store = {
  getIsland() { return localStorage.getItem('ohaeng-island') || ''; },
  setIsland(id) { try { localStorage.setItem('ohaeng-island', id); } catch (e) {} },
  getPos(id) { try { return JSON.parse(localStorage.getItem('ohaeng-pos-' + id)); } catch (e) { return null; } },
  setPos(id, p) { try { localStorage.setItem('ohaeng-pos-' + id, JSON.stringify(p)); } catch (e) {} },
  seenTutorial() { return localStorage.getItem('ohaeng-tut') === '1'; },
  markTutorial() { try { localStorage.setItem('ohaeng-tut', '1'); } catch (e) {} }
};

/* =====================================================
   3. WORLD: 걷기 판정과 길찾기(BFS)
   ===================================================== */
const World = {
  walkable(isl, x, y) {
    if (x < 0 || y < 0 || x >= W || y >= isl.H) return false;
    const c = isl.map[y][x];
    return c === '.' || c === 'D' || c === '=';
  },
  path(isl, sx, sy, tx, ty) {
    const key = (x, y) => y * W + x;
    const prev = new Map([[key(sx, sy), null]]);
    const q = [[sx, sy]];
    const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
    while (q.length) {
      const [x, y] = q.shift();
      if (x === tx && y === ty) break;
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (!this.walkable(isl, nx, ny) || prev.has(key(nx, ny))) continue;
        prev.set(key(nx, ny), [x, y]);
        q.push([nx, ny]);
      }
    }
    if (!prev.has(key(tx, ty))) return null;
    const out = [];
    let cur = [tx, ty];
    while (cur) { out.unshift(cur); cur = prev.get(key(cur[0], cur[1])); }
    return out;
  }
};

/* =====================================================
   4. SCREEN: 화면 전환
   ===================================================== */
const $ = id => document.getElementById(id);
const screens = { start: $('s-start'), select: $('s-select'), island: $('s-island') };
function show(name) {
  Object.values(screens).forEach(s => s.classList.remove('on'));
  screens[name].classList.add('on');
}

/* =====================================================
   5. 섬 선택 UI
   - 섬마다 개별 이미지를 bbox 위치에 놓음 (사각 배경 없음)
   - 누른 채 움직이면 그 섬이 커짐 (마우스·터치 공통)
   ===================================================== */
let pick = null;
let dragging = null;     // 누른 상태의 섬 요소

function buildStage() {
  const stage = $('stage');
  stage.innerHTML = '';
  ISLANDS.forEach(isl => {
    const b = isl.bbox;
    const el = document.createElement('div');
    el.className = 'isl';
    el.dataset.id = isl.id;
    el.style.left = (b.x / MAP_W * 100) + '%';
    el.style.top = (b.y / MAP_H * 100) + '%';
    el.style.width = (b.w / MAP_W * 100) + '%';
    el.style.height = (b.h / MAP_H * 100) + '%';
    el.innerHTML = `<img src="${isl.img}" alt="${isl.el} ${isl.name}"><span class="label">${isl.el}(${isl.hanja}) · ${isl.name}</span>`;
    if (pick && pick.id === isl.id) el.classList.add('on');
    stage.appendChild(el);
  });
}

// 누르기 → 커지기, 움직이면 손가락/마우스 아래 섬이 커짐, 떼면 선택
$('stage').addEventListener('pointerdown', e => {
  const el = e.target.closest('.isl');
  if (!el) return;
  dragging = el;
  el.classList.add('big');
  el.setPointerCapture?.(e.pointerId);
});
$('stage').addEventListener('pointermove', e => {
  if (!dragging) return;
  const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.isl');
  document.querySelectorAll('.isl.big').forEach(el => { if (el !== under) el.classList.remove('big'); });
  if (under) { under.classList.add('big'); dragging = under; }
});
window.addEventListener('pointerup', () => {
  if (!dragging) return;
  const id = dragging.dataset.id;
  dragging = null;
  document.querySelectorAll('.isl.big').forEach(el => el.classList.remove('big'));
  const isl = ISLANDS.find(i => i.id === id);
  if (isl) selectIsland(isl);
});
window.addEventListener('pointercancel', () => {
  dragging = null;
  document.querySelectorAll('.isl.big').forEach(el => el.classList.remove('big'));
});

function refreshSelected() {
  document.querySelectorAll('.isl').forEach(el => {
    el.classList.toggle('on', !!pick && el.dataset.id === pick.id);
  });
}

function selectIsland(isl) {
  pick = isl;
  refreshSelected();
  $('btnGo').disabled = false;
  showInfo(isl);
}

// 선택 전: 이름과 오행만 (지도 라벨). 선택 후: 지형과 집터 정보
function showInfo(isl) {
  if (!isl) { $('info').innerHTML = '섬을 누르면 지형과 집터 정보가 나와요.'; return; }
  $('info').innerHTML =
    `<h3>${isl.el}(${isl.hanja}) · ${isl.name}</h3>` +
    `<p><b>지형</b>: ${isl.terrain}</p><p><b>집터</b>: ${isl.plots}</p>`;
}

/* =====================================================
   6. 섬 화면: 그리기, 캐릭터 이동
   ===================================================== */
const cv = $('cv');
const ctx = cv.getContext('2d');
let isl = null, T = 32, OX = 0, OY = 0;
let pos = {x:0, y:0}, px = 0, py = 0, route = [];
const SPEED = 5;

function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  T = Math.max(8, Math.floor(Math.min(r.width / W, r.height / isl.H)));
  OX = (r.width - T * W) / 2;
  OY = (r.height - T * isl.H) / 2;
}

const TILE_CSS = (isl, ch) => ({'.':isl.color,'D':isl.color,'=':isl.path,'#':isl.dark,'~':isl.water,' ':'transparent'})[ch];

function drawTile(x, y, ch) {
  const px0 = OX + x * T, py0 = OY + y * T;
  ctx.fillStyle = TILE_CSS(isl, ch);
  ctx.fillRect(px0, py0, T, T);
  ctx.strokeStyle = 'rgba(0,0,0,.06)';
  ctx.strokeRect(px0 + .5, py0 + .5, T - 1, T - 1);
  if (ch === '#' || ch === '~') {
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.moveTo(px0, py0 + T); ctx.lineTo(px0 + T, py0);
    ctx.moveTo(px0, py0 + T * .5); ctx.lineTo(px0 + T * .5, py0);
    ctx.moveTo(px0 + T * .5, py0 + T); ctx.lineTo(px0 + T, py0 + T * .5);
    ctx.stroke();
  }
  if (ch === 'D') {
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(px0 + T * .2, py0 + T * .2, T * .6, T * .6);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(T * .45)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚓', px0 + T / 2, py0 + T / 2 + 1);
  }
}

function drawCharacter() {
  const cx = OX + (px + .5) * T, cy = OY + (py + .5) * T, r = T * .32;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(cx, cy + r * .9, r * .9, r * .4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe0bd';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = isl.dark;
  ctx.fillRect(cx - r, cy - r * .6, r * 2, r * .35);
  ctx.fillStyle = '#2d2a3a';
  ctx.beginPath(); ctx.arc(cx - r * .35, cy + r * .1, r * .1, 0, Math.PI * 2);
  ctx.arc(cx + r * .35, cy + r * .1, r * .1, 0, Math.PI * 2); ctx.fill();
}

function draw() {
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.fillStyle = '#c9e7f2';
  ctx.fillRect(0, 0, r.width, r.height);
  for (let y = 0; y < isl.H; y++) for (let x = 0; x < W; x++) {
    const ch = isl.map[y][x];
    if (ch !== ' ') drawTile(x, y, ch);
  }
  drawCharacter();
}

function loop(t) {
  if (isl && screens.island.classList.contains('on')) {
    const dt = Math.min(.05, (t - (loop.last || t)) / 1000);
    loop.last = t;
    if (route.length) {
      const [tx, ty] = route[0];
      const dx = tx - px, dy = ty - py, d = Math.hypot(dx, dy), step = SPEED * dt;
      if (d <= step) {
        px = tx; py = ty; route.shift();
        pos = {x:tx, y:ty};
        if (!route.length) Store.setPos(isl.id, pos);
      } else { px += dx / d * step; py += dy / d * step; }
    }
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function say(text) { $('islMsg').textContent = text; }
function bubble(text, ms = 3500) {
  const b = $('bubble');
  b.textContent = text; b.style.display = 'block';
  clearTimeout(bubble.t);
  bubble.t = setTimeout(() => b.style.display = 'none', ms);
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left - OX) / T);
  const y = Math.floor((e.clientY - r.top - OY) / T);
  if (!World.walkable(isl, x, y)) {
    const c = (x >= 0 && y >= 0 && x < W && y < isl.H) ? isl.map[y][x] : '';
    say(`${TILE_NAMES[c] || '바깥'} 칸은 걸을 수 없어요. 땅이나 길을 눌러 주세요.`);
    return;
  }
  const p = World.path(isl, Math.round(px), Math.round(py), x, y);
  if (!p) { say('그곳까지 이어지는 길이 없어요.'); return; }
  route = p.slice(1);
  say('');
});

/* =====================================================
   7. 섬 입장/퇴장
   ===================================================== */
function enterIsland(target) {
  isl = target;
  Store.setIsland(isl.id);
  const saved = Store.getPos(isl.id);
  const ok = saved && World.walkable(isl, saved.x, saved.y);
  pos = ok ? {x:saved.x, y:saved.y} : {...isl.dock};
  px = pos.x; py = pos.y; route = [];
  $('islName').textContent = `${isl.el}(${isl.hanja}) · ${isl.name}`;
  show('island');
  resize();
  say('화면을 눌러 섬을 걸어 보세요.');
  if (!Store.seenTutorial()) {
    bubble('여기가 당신의 섬이에요. 집 터를 찾아 걸어 보세요!', 5000);
    Store.markTutorial();
  }
}

function leaveIsland() {
  if (isl) Store.setPos(isl.id, pos);
  show('select');
  buildStage();
  refreshSelected();
  showInfo(pick);
  $('btnGo').disabled = !pick;
}

/* =====================================================
   8. 이벤트 연결
   ===================================================== */
$('btnStart').onclick = () => {
  show('select');
  buildStage();
  refreshSelected();
  showInfo(pick);
  $('btnGo').disabled = !pick;
};
$('btnSelBack').onclick = () => show('start');
$('btnGo').onclick = () => { if (pick) $('confirm').classList.add('on'); };
$('btnNo').onclick = () => $('confirm').classList.remove('on');
$('btnYes').onclick = () => { $('confirm').classList.remove('on'); if (pick) enterIsland(pick); };
$('btnBack').onclick = leaveIsland;

window.addEventListener('resize', () => { if (isl && screens.island.classList.contains('on')) resize(); });
window.addEventListener('pagehide', () => { if (isl) Store.setPos(isl.id, pos); });

(function restoreChoice() {
  const id = Store.getIsland();
  pick = ISLANDS.find(i => i.id === id) || null;
})();
</script>
</body>
</html>
