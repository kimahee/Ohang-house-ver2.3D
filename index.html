<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오행의 집 GAME</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#2d2a3a;background:#20323a}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:#dfeeee url('assets/bg-sea.png') center/cover no-repeat}
.screen.on{display:flex}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;min-height:44px;background:#2d2a3a;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#2d2a3a;box-shadow:inset 0 0 0 2px #2d2a3a}
button:disabled{opacity:.4;cursor:default}
.head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.75)}
.head h2{flex:1;font-size:16px}
.head button{padding:8px 12px;min-height:38px;font-size:13px}

/* 타이틀 */
#s-start{align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px}
.title-box{background:rgba(255,255,255,.6);border-radius:24px;padding:26px 22px}
.logo{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.logo i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900}
#s-start h1{font-size:30px;font-weight:900}
#s-start p{font-size:14px;color:#4b4658;margin-top:6px}
#btnStart{font-size:18px;padding:16px 36px;background:#c0392b;margin-top:18px}

/* 섬 선택 */
.mapArea{flex:1;min-height:0;position:relative;overflow:hidden}
.stage{position:absolute;inset:0}
.isl{position:absolute;cursor:pointer;transition:transform .2s ease,filter .2s ease;transform-origin:50% 60%;touch-action:none;user-select:none;-webkit-user-select:none}
.isl img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;display:block}
.isl.hover{transform:scale(1.15);z-index:5}
.isl.on,.isl.press{transform:scale(1.2);z-index:6;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.label{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;pointer-events:none;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.isl.on .label,.isl.press .label{background:#2d2a3a;color:#fff}
.infoBox{margin:0 12px;background:#fff;border-radius:16px;padding:12px 14px;min-height:96px;font-size:14px;line-height:1.55;color:#4b4658}
.infoBox h3{font-size:17px;color:#2d2a3a;margin-bottom:6px}
.foot{padding:12px}
.foot button{width:100%}
.modal{position:absolute;inset:0;background:rgba(20,16,30,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:18px;padding:22px 18px;text-align:center;max-width:340px;width:100%}
.modal p{font-size:16px;font-weight:800;margin-bottom:16px}
.modal .btns{display:flex;gap:10px}
.modal .btns button{flex:1}

/* 섬 화면: 위 1/3 하늘, 아래 2/3 땅 (캔버스 한 장에 그림) */
#s-island{background:#bfe3f2}
#islWrap{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#islMsg{position:absolute;left:8px;right:8px;bottom:8px;font-size:12px;line-height:1.4;color:#2d2a3a;background:rgba(255,255,255,.88);border-radius:10px;padding:6px 10px;pointer-events:none}

@media (min-width:800px){.infoBox{max-width:720px;margin:0 auto 12px;width:calc(100% - 24px)}}
</style>
</head>
<body>

<!-- 타이틀 -->
<section id="s-start" class="screen on">
  <div class="title-box">
    <div class="logo">
      <i style="background:#5fae6a">木</i><i style="background:#e8786a">火</i><i style="background:#c99a63">土</i>
      <i style="background:#9aa7b4">金</i><i style="background:#4d9fd6">水</i>
    </div>
    <h1>오행의 집 GAME</h1>
    <p>다섯 섬 중 하나에서 나만의 집을 꾸며보세요</p>
    <button id="btnStart">GAME START</button>
  </div>
</section>

<!-- 섬 선택 -->
<section id="s-select" class="screen">
  <div class="head">
    <button id="btnSelBack" class="ghost">←</button>
    <h2>섬 고르기</h2>
  </div>
  <div class="mapArea"><div class="stage" id="stage"></div></div>
  <div class="infoBox" id="info">섬을 누르면 지형과 집터 정보가 나와요.</div>
  <div class="foot"><button id="btnGo" disabled>이 섬에서 살기</button></div>
  <div class="modal" id="confirm">
    <div class="box">
      <p>이 섬으로 선택하겠습니까?</p>
      <div class="btns">
        <button id="btnYes">예</button>
        <button id="btnNo" class="ghost">아니오</button>
      </div>
    </div>
  </div>
</section>

<!-- 섬 화면 -->
<section id="s-island" class="screen">
  <div class="head">
    <button id="btnBack" class="ghost">← 섬 고르기</button>
    <h2 id="islName"></h2>
  </div>
  <div id="islWrap">
    <canvas id="cv"></canvas>
    <div id="islMsg"></div>
  </div>
</section>

<script>
/* =====================================================
   1. DATA: 설정, 경로, 섬 정보
   - V: 이미지 캐시 무효화 값. 파일을 고칠 때마다 바꾸세요.
   - 월드 좌표 = 섬 이미지 원본 픽셀 (1024×768)
   ===================================================== */
const V = 'r20261119';
const $ = id => document.getElementById(id);

const PATH = {
  bg:   'assets/bg-sea.png',
  mask: 'assets/fire/walk-mask.png',          // 선택: 흰색=걷기 가능. 없으면 섬 알파값 사용
  down: 'assets/char/idle-down.png',          // 필수: 정면 대기
  back: 'assets/char/idle-back.png',          // 필수: 뒷모습
  left: 'assets/char/walk-left-1.png',        // 필수: 왼쪽 (오른쪽은 반전)
  wd:   ['assets/char/walk-down-1.png','assets/char/walk-down-2.png',
         'assets/char/walk-down-3.png','assets/char/walk-down-4.png']   // 선택: 정면 걷기 프레임
};

const WORLD_W = 1024, WORLD_H = 768;   // 월드 크기
const GRID = 4;                        // 걷기 판정 격자 한 칸 = 월드 4px
const GW = WORLD_W / GRID, GH = WORLD_H / GRID;
const SKY_RATIO = 1 / 3;               // 화면 위 1/3 하늘, 아래 2/3 땅
const VIEW_H_WORLD = 300;              // 땅 영역 세로에 보이는 월드 높이 (화면이 클수록 더 크게 보임)
const CHAR_H = 34;                     // 캐릭터 높이 (월드 px)
const WALK_SPEED = 130;                // 이동 속도 (월드 px/초)

const ISLANDS = [
  { id:'geum', el:'금', hanja:'金', name:'은빛봉우리 섬', img:'assets/islands/geum.png',
    bbox:{x:29,y:1,w:38,h:52},
    terrain:'흰 바위 봉우리 세 개와 그 아래 펼쳐진 돌빛 평지',
    plots:'집터 3곳 (봉우리 아래 평지, 봉우리 사이, 돌빛 가장자리)' },
  { id:'hwa', el:'화', hanja:'火', name:'붉은절벽 섬', img:'assets/islands/hwa.png',
    bbox:{x:6,y:14,w:28,h:80},
    terrain:'한쪽으로 길게 이어지는 붉은 절벽과 아래쪽의 따뜻한 빛깔 들판',
    plots:'집터 2곳 (절벽 위 전망 터, 들판 입구 터)' },
  { id:'to', el:'토', hanja:'土', name:'황금들판 섬', img:'assets/islands/to.png',
    bbox:{x:36,y:31,w:28,h:40},
    terrain:'뒤쪽의 둥근 언덕 두 개와 지도에서 가장 넓은 평원',
    plots:'집터 4곳 (평원 중심, 언덕 아래, 길가, 들판 끝)' },
  { id:'su', el:'수', hanja:'水', name:'물굽이 섬', img:'assets/islands/su.png',
    bbox:{x:62,y:6,w:26,h:86},
    terrain:'작은 만으로 이어지는 굽은 강과 강 안쪽의 넓은 풀밭',
    plots:'집터 2곳 (강가 터, 풀밭 터)' },
  { id:'mok', el:'목', hanja:'木', name:'풀빛언덕 섬', img:'assets/islands/mok.png',
    bbox:{x:33,y:68,w:34,h:24},
    terrain:'층층이 이어지는 낮은 언덕과 한가운데의 열린 들판',
    plots:'집터 3곳 (언덕 계단 터, 들판 터, 숲 가장자리 터)' }
];
const byId = id => ISLANDS.find(i => i.id === id) || null;

const Store = {
  getIsland() { try { return localStorage.getItem('ohaeng-island') || ''; } catch (e) { return ''; } },
  setIsland(id) { try { localStorage.setItem('ohaeng-island', id); } catch (e) {} },
  getPos(id) { try { return JSON.parse(localStorage.getItem('ohaeng-pos-' + id)); } catch (e) { return null; } },
  setPos(id, p) { try { localStorage.setItem('ohaeng-pos-' + id, JSON.stringify(p)); } catch (e) {} }
};

/* =====================================================
   2. ASSETS: 이미지 로드, 캐릭터 투명 여백 제거
   - 실패한 필수 파일은 failed에 모아 화면에 표시
   ===================================================== */
const failed = [];
function loadImg(src, quiet = false) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => { if (!quiet) failed.push(src); res(null); };
    i.src = src + '?' + V;
  });
}

// 세 캐릭터(+걷기 프레임)의 투명 여백을 공통 사각형으로 잘라 크기와 발 위치를 맞춤
function trimSprites(list) {
  const cans = list.map(img => {
    if (!img) return null;
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0);
    return c;
  });
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  cans.forEach(c => {
    if (!c) return;
    const w = c.width, h = c.height;
    const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 12) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  });
  if (x1 < 0) return cans;                        // 알파가 없으면 원본 그대로
  const rw = x1 - x0 + 1, rh = y1 - y0 + 1;
  return cans.map(c => {
    if (!c) return null;
    const o = document.createElement('canvas');
    o.width = rw; o.height = rh;
    o.getContext('2d').drawImage(c, x0, y0, rw, rh, 0, 0, rw, rh);
    return o;
  });
}

/* =====================================================
   3. WORLD: 걷기 격자, 판정, 경로 탐색
   - 마스크(흰색=걷기)가 있으면 그것을 사용
   - 없으면 섬 알파값으로 판정하고, 바닷가 1칸을 깎아 발이 물에 걸치지 않게 함
   ===================================================== */
function buildGrid(islImg, maskImg) {
  const c = document.createElement('canvas');
  c.width = GW; c.height = GH;
  const g = c.getContext('2d', { willReadFrequently: true });
  const base = new Uint8Array(GW * GH);

  if (maskImg) {
    g.drawImage(maskImg, 0, 0, GW, GH);
    const d = g.getImageData(0, 0, GW, GH).data;
    for (let i = 0; i < base.length; i++) base[i] = d[i * 4] > 128 ? 1 : 0;
    return base;
  }
  if (!islImg) return base.fill(1);               // 이미지가 전혀 없으면 막지 않음

  g.drawImage(islImg, 0, 0, GW, GH);
  const d = g.getImageData(0, 0, GW, GH).data;
  for (let i = 0; i < base.length; i++) base[i] = d[i * 4 + 3] >= 128 ? 1 : 0;

  const out = new Uint8Array(GW * GH);             // 1칸 침식
  for (let y = 1; y < GH - 1; y++) for (let x = 1; x < GW - 1; x++) {
    const i = y * GW + x;
    if (base[i] && base[i - 1] && base[i + 1] && base[i - GW] && base[i + GW]) out[i] = 1;
  }
  return out;
}

const Game = { ready: false, isl: null, img: null, bg: null, grid: null,
               px: 0, py: 0, dir: 'down', moving: false, path: null };
const S = { down: null, back: null, left: null, wd: [] };

function walkAt(x, y) {
  const gx = Math.floor(x / GRID), gy = Math.floor(y / GRID);
  return gx >= 0 && gy >= 0 && gx < GW && gy < GH && Game.grid[gy * GW + gx] === 1;
}
// 발 중심과 상하좌우 3px 지점이 모두 걸을 수 있어야 함
function canStand(x, y) {
  return walkAt(x, y) && walkAt(x - 3, y) && walkAt(x + 3, y) && walkAt(x, y - 3) && walkAt(x, y + 3);
}

// 격자 BFS (8방향, 모서리 자르기 금지). 결과는 월드 좌표 배열
function findPath(sx, sy, tx, ty) {
  const s = Math.floor(sy / GRID) * GW + Math.floor(sx / GRID);
  const t = Math.floor(ty / GRID) * GW + Math.floor(tx / GRID);
  if (!walkAt(tx, ty)) return null;
  const prev = new Int32Array(GW * GH).fill(-1);
  const q = new Int32Array(GW * GH);
  let h = 0, tl = 0;
  prev[s] = s; q[tl++] = s;
  const DX = [1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1];
  while (h < tl) {
    const c = q[h++];
    if (c === t) break;
    const cx = c % GW, cy = (c / GW) | 0;
    for (let k = 0; k < 8; k++) {
      const nx = cx + DX[k], ny = cy + DY[k];
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      if (!Game.grid[ny * GW + nx]) continue;
      if (k >= 4 && (!Game.grid[cy * GW + nx] || !Game.grid[ny * GW + cx])) continue;
      const ni = ny * GW + nx;
      if (prev[ni] !== -1) continue;
      prev[ni] = c; q[tl++] = ni;
    }
  }
  if (prev[t] === -1) return null;
  const idx = [];
  let c = t;
  while (c !== s) { idx.push(c); c = prev[c]; }
  idx.reverse();
  return idx.map(i => ({ x: (i % GW) * GRID + GRID / 2, y: ((i / GW) | 0) * GRID + GRID / 2 }));
}

// 섬 중앙에서 가장 가까운 걸을 수 있는 지점
function findStart() {
  let best = null, bd = Infinity;
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    const x = gx * GRID + GRID / 2, y = gy * GRID + GRID / 2;
    if (!canStand(x, y)) continue;
    const d = (x - WORLD_W / 2) ** 2 + (y - WORLD_H / 2) ** 2;
    if (d < bd) { bd = d; best = { x, y }; }
  }
  return best || { x: WORLD_W / 2, y: WORLD_H / 2 };
}

/* =====================================================
   4. PLAYER: 입력(키보드, 터치 이동), 상태 갱신
   ===================================================== */
const keys = { u: false, d: false, l: false, r: false };
const KEYMAP = { KeyW:'u', ArrowUp:'u', KeyS:'d', ArrowDown:'d', KeyA:'l', ArrowLeft:'l', KeyD:'r', ArrowRight:'r' };

window.addEventListener('keydown', e => {
  if (!screens.island.classList.contains('on')) return;
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function moveTo(x, y, quiet) {
  const p = findPath(Game.px, Game.py, x, y);
  if (!p) { if (!quiet) setMsg('그곳은 바다나 절벽이라 걸을 수 없어요.'); return; }
  Game.path = p;
}

function update(dt) {
  let dx = 0, dy = 0;
  if (keys.l) dx -= 1;
  if (keys.r) dx += 1;
  if (keys.u) dy -= 1;
  if (keys.d) dy += 1;

  if (dx || dy) {                                  // 키 입력이 있으면 경로 취소
    Game.path = null;
    const n = Math.hypot(dx, dy); dx /= n; dy /= n;
  } else if (Game.path) {
    while (Game.path.length && Math.hypot(Game.path[0].x - Game.px, Game.path[0].y - Game.py) < 2) Game.path.shift();
    if (!Game.path.length) Game.path = null;
    else {
      const p = Game.path[0];
      const d = Math.hypot(p.x - Game.px, p.y - Game.py);
      dx = (p.x - Game.px) / d; dy = (p.y - Game.py) / d;
    }
  }

  const ox = Game.px, oy = Game.py;
  const step = WALK_SPEED * dt;
  if (dx || dy) {
    const nx = Game.px + dx * step, ny = Game.py + dy * step;
    if (canStand(nx, Game.py)) Game.px = nx;       // 축별로 검사해 벽을 따라 미끄러짐
    if (canStand(Game.px, ny)) Game.py = ny;
    if (Math.abs(dx) >= Math.abs(dy)) Game.dir = dx < 0 ? 'left' : 'right';
    else Game.dir = dy < 0 ? 'up' : 'down';
  }
  Game.moving = Game.px !== ox || Game.py !== oy;
  if (!Game.moving && Game.path) Game.path = null;  // 막히면 경로 취소
}

function spriteNow(now) {
  switch (Game.dir) {
    case 'up':    return { c: S.back, f: false };
    case 'left':  return { c: S.left, f: false };
    case 'right': return { c: S.left, f: true };
    default:
      if (Game.moving && S.wd.length) return { c: S.wd[Math.floor(now / 130) % S.wd.length], f: false };
      return { c: S.down, f: false };
  }
}

/* =====================================================
   5. RENDER: 하늘 고정, 땅 스크롤, 캐릭터 중심 카메라
   ===================================================== */
const cv = $('cv');
const ctx = cv.getContext('2d');
const V2 = { W: 0, H: 0, hz: 0, gh: 0, z: 1, camX: 0, camY: 0 };

function layout() {
  const r = cv.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  V2.W = r.width; V2.H = r.height;
  V2.hz = Math.round(r.height * SKY_RATIO);
  V2.gh = r.height - V2.hz;
  V2.z = V2.gh / VIEW_H_WORLD;                      // 땅 영역에 보이는 월드 높이를 고정 → 화면 크기와 무관하게 비율 유지
}

function updateCamera() {
  const halfW = V2.W / (2 * V2.z), halfH = V2.gh / (2 * V2.z);
  V2.camX = WORLD_W <= 2 * halfW ? WORLD_W / 2 : Math.min(WORLD_W - halfW, Math.max(halfW, Game.px));
  V2.camY = WORLD_H <= 2 * halfH ? WORLD_H / 2 : Math.min(WORLD_H - halfH, Math.max(halfH, Game.py));
}

function drawCover(img, x, y, w, h) {
  const k = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
  ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
}

function drawPlayer(now) {
  const sp = spriteNow(now);
  const c = sp.c;
  const h = CHAR_H;
  const w = c ? h * c.width / c.height : h * 0.8;
  const bob = Game.moving ? Math.abs(Math.sin(now / 110)) * 1.5 : 0;

  ctx.fillStyle = 'rgba(0,0,0,.22)';               // 발 아래 그림자
  ctx.beginPath();
  ctx.ellipse(Game.px, Game.py, h * .3, h * .09, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(Game.px, Game.py - bob);
  if (sp.f) ctx.scale(-1, 1);
  if (c) ctx.drawImage(c, -w / 2, -h, w, h);
  else {                                           // 이미지가 없으면 대체 도형
    ctx.fillStyle = '#e8786a';
    ctx.beginPath(); ctx.arc(0, -h / 2, h / 2.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function draw(now) {
  const { W, H, hz, gh, z } = V2;
  ctx.clearRect(0, 0, W, H);

  // 하늘 (위 1/3)
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, hz); ctx.clip();
  if (Game.bg) drawCover(Game.bg, 0, 0, W, hz);
  else {
    const g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#9fd8ef'); g.addColorStop(1, '#fff6dc');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz);
  }
  ctx.restore();

  // 땅 (아래 2/3): 섬과 바다를 카메라 기준으로 그림
  ctx.save();
  ctx.beginPath(); ctx.rect(0, hz, W, gh); ctx.clip();
  ctx.fillStyle = '#9fcfdc';
  ctx.fillRect(0, hz, W, gh);
  updateCamera();
  ctx.translate(W / 2, hz + gh / 2);
  ctx.scale(z, z);
  ctx.translate(-V2.camX, -V2.camY);
  if (Game.img) ctx.drawImage(Game.img, 0, 0, WORLD_W, WORLD_H);
  drawPlayer(now);
  ctx.restore();

  // 하늘과 땅의 경계 그림자
  const g = ctx.createLinearGradient(0, hz, 0, hz + 12);
  g.addColorStop(0, 'rgba(0,0,0,.18)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, hz, W, 12);
}

// 터치/드래그 → 월드 좌표 (하늘 쪽은 null)
function screenToWorld(e) {
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  if (sy < V2.hz) { setMsg('하늘 쪽은 걸을 수 없어요. 땅을 눌러 주세요.'); return null; }
  return {
    x: (sx - V2.W / 2) / V2.z + V2.camX,
    y: (sy - (V2.hz + V2.gh / 2)) / V2.z + V2.camY
  };
}

let dragging = false, lastPt = null;
cv.addEventListener('pointerdown', e => {
  if (!Game.ready) return;
  const p = screenToWorld(e);
  if (!p) return;
  dragging = true; lastPt = p;
  cv.setPointerCapture(e.pointerId);
  moveTo(p.x, p.y);
});
cv.addEventListener('pointermove', e => {
  if (!dragging || !Game.ready) return;
  const p = screenToWorld(e);
  if (!p) return;
  if (!lastPt || Math.hypot(p.x - lastPt.x, p.y - lastPt.y) > 12) {   // 너무 자주 경로를 다시 계산하지 않음
    lastPt = p;
    moveTo(p.x, p.y, true);
  }
});
window.addEventListener('pointerup', () => { dragging = false; lastPt = null; });
window.addEventListener('pointercancel', () => { dragging = false; lastPt = null; });

/* =====================================================
   6. SELECT UI: 섬 선택 (이전 단계와 동일)
   ===================================================== */
let pick = null, down = false, under = null;

function placeLabel(el) {
  const img = el.querySelector('img'), lab = el.querySelector('.label');
  if (!img || !lab || !img.naturalWidth) return;
  const bw = el.clientWidth, bh = el.clientHeight;
  if (!bw || !bh) return;
  const scale = Math.min(bw / img.naturalWidth, bh / img.naturalHeight);
  lab.style.top = ((bh - img.naturalHeight * scale) / 2 - lab.offsetHeight - 4) + 'px';
}
function placeAllLabels() { document.querySelectorAll('.isl').forEach(placeLabel); }

function buildStage() {
  const stage = $('stage');
  stage.innerHTML = '';
  ISLANDS.forEach(isl => {
    const b = isl.bbox;
    const el = document.createElement('div');
    el.className = 'isl';
    el.dataset.id = isl.id;
    el.style.left = b.x + '%'; el.style.top = b.y + '%';
    el.style.width = b.w + '%'; el.style.height = b.h + '%';
    el.innerHTML = `<img src="${isl.img}" alt="${isl.el} ${isl.name}"><span class="label">${isl.el}(${isl.hanja}) · ${isl.name}</span>`;
    const img = el.querySelector('img');
    img.addEventListener('load', () => placeLabel(el));
    img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
    el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') el.classList.add('hover'); });
    el.addEventListener('pointerleave', () => el.classList.remove('hover'));
    stage.appendChild(el);
  });
  refreshSelected();
  placeAllLabels();
}
function refreshSelected() {
  document.querySelectorAll('.isl').forEach(el => el.classList.toggle('on', !!pick && el.dataset.id === pick.id));
}
function setPress(el) {
  document.querySelectorAll('.isl.press').forEach(e => e.classList.remove('press'));
  if (el) el.classList.add('press');
}
const stageEl = $('stage');
stageEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.isl');
  if (!el) return;
  down = true; under = el; setPress(el);
});
window.addEventListener('pointermove', e => {
  if (!down) return;
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('.isl') || null;
  if (el !== under) { under = el; setPress(el); }
});
window.addEventListener('pointerup', () => {
  if (!down) return;
  down = false;
  const t = under; under = null; setPress(null);
  if (t) selectIsland(byId(t.dataset.id));
});
window.addEventListener('pointercancel', () => { down = false; under = null; setPress(null); });
if (window.ResizeObserver) new ResizeObserver(placeAllLabels).observe(stageEl);

function selectIsland(isl) {
  if (!isl) return;
  pick = isl;
  refreshSelected();
  $('btnGo').disabled = false;
  showInfo(isl);
}
function showInfo(isl) {
  if (!isl) { $('info').innerHTML = '섬을 누르면 지형과 집터 정보가 나와요.'; return; }
  $('info').innerHTML = `<h3>${isl.el}(${isl.hanja}) · ${isl.name}</h3><p><b>지형</b>: ${isl.terrain}</p><p><b>집터</b>: ${isl.plots}</p>`;
}

/* =====================================================
   7. UI: 화면 전환, 섬 입장, 게임 루프
   ===================================================== */
const screens = { start: $('s-start'), select: $('s-select'), island: $('s-island') };
function show(name) {
  Object.values(screens).forEach(s => s.classList.remove('on'));
  screens[name].classList.add('on');
}
function setMsg(t) { $('islMsg').textContent = t; }

async function enterIsland(isl) {
  Game.ready = false;
  Game.isl = isl;
  Store.setIsland(isl.id);
  $('islName').textContent = `${isl.el}(${isl.hanja}) · ${isl.name}`;
  show('island');
  setMsg('이미지를 불러오는 중…');
  failed.length = 0;

  const [img, mask, bg, d, b, l, ...wd] = await Promise.all([
    loadImg(isl.img),
    isl.id === 'hwa' ? loadImg(PATH.mask, true) : null,
    loadImg(PATH.bg, true),
    loadImg(PATH.down), loadImg(PATH.back), loadImg(PATH.left),
    ...PATH.wd.map(p => loadImg(p, true))
  ]);

  const t = trimSprites([d, b, l, ...wd]);
  S.down = t[0]; S.back = t[1]; S.left = t[2];
  S.wd = t.slice(3).filter(Boolean);
  Game.img = img; Game.bg = bg;
  Game.grid = buildGrid(img, mask);

  const saved = Store.getPos(isl.id);
  const st = saved && canStand(saved.x, saved.y) ? saved : findStart();
  Game.px = st.x; Game.py = st.y;
  Game.dir = 'down'; Game.moving = false; Game.path = null;

  layout();
  Game.ready = true;

  const bad = failed.filter(p => p !== PATH.mask);
  setMsg(bad.length
    ? '불러오지 못한 파일(경로 확인): ' + bad.join(', ')
    : '화면을 누르거나 WASD·방향키로 걸어 보세요.');
}

let last = 0, saveAcc = 0;
function frame(t) {
  const dt = Math.min(0.05, last ? (t - last) / 1000 : 0);
  last = t;
  if (Game.ready && screens.island.classList.contains('on') && V2.W) {
    update(dt);
    draw(t);
    saveAcc += dt;
    if (saveAcc > 0.5) {
      Store.setPos(Game.isl.id, { x: Math.round(Game.px), y: Math.round(Game.py) });
      saveAcc = 0;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (window.ResizeObserver) new ResizeObserver(() => { if (Game.ready) layout(); }).observe($('islWrap'));
window.addEventListener('pagehide', () => {
  if (Game.ready && Game.isl) Store.setPos(Game.isl.id, { x: Math.round(Game.px), y: Math.round(Game.py) });
});

$('btnStart').onclick = () => { show('select'); buildStage(); showInfo(pick); $('btnGo').disabled = !pick; };
$('btnSelBack').onclick = () => show('start');
$('btnGo').onclick = () => { if (pick) $('confirm').classList.add('on'); };
$('btnNo').onclick = () => $('confirm').classList.remove('on');
$('btnYes').onclick = () => { $('confirm').classList.remove('on'); if (pick) enterIsland(pick); };
$('btnBack').onclick = () => {
  if (Game.ready && Game.isl) Store.setPos(Game.isl.id, { x: Math.round(Game.px), y: Math.round(Game.py) });
  Game.ready = false;
  show('select'); buildStage(); showInfo(pick); $('btnGo').disabled = !pick;
};

pick = byId(Store.getIsland());
</script>
</body>
</html>
