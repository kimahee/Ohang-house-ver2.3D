<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오행의 집 GAME</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#2d2a3a;background:#20323a}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:#dfeeee url('assets/bg-sea.png') center/cover no-repeat}
.screen.on{display:flex}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;min-height:44px;background:#2d2a3a;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#2d2a3a;box-shadow:inset 0 0 0 2px #2d2a3a}
button:disabled{opacity:.4;cursor:default}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.7)}
.head h2{flex:1;font-size:17px}
.head button{padding:8px 12px;min-height:38px;font-size:13px}

/* 타이틀 */
#s-start{align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px}
.title-box{background:rgba(255,255,255,.6);border-radius:24px;padding:26px 22px}
.logo{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.logo i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900}
#s-start h1{font-size:30px;font-weight:900}
#s-start p{font-size:14px;color:#4b4658;margin-top:6px}
#btnStart{font-size:18px;padding:16px 36px;background:#c0392b;margin-top:18px}

/* 섬 선택 */
.mapArea{flex:1;min-height:0;position:relative;overflow:hidden}
.stage{position:absolute;inset:0}
.isl{position:absolute;cursor:pointer;transition:transform .2s ease,filter .2s ease;transform-origin:50% 60%;touch-action:none;user-select:none;-webkit-user-select:none}
.isl img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;display:block}
.isl.hover{transform:scale(1.15);z-index:5}
.isl.on,.isl.press{transform:scale(1.2);z-index:6;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.label{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;pointer-events:none;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.isl.on .label,.isl.press .label{background:#2d2a3a;color:#fff}
.infoBox{margin:0 12px;background:#fff;border-radius:16px;padding:12px 14px;min-height:96px;font-size:14px;line-height:1.55;color:#4b4658}
.infoBox h3{font-size:17px;color:#2d2a3a;margin-bottom:6px}
.foot{padding:12px}
.foot button{width:100%}
.modal{position:absolute;inset:0;background:rgba(20,16,30,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:18px;padding:22px 18px;text-align:center;max-width:340px;width:100%}
.modal p{font-size:16px;font-weight:800;margin-bottom:16px}
.modal .btns{display:flex;gap:10px}
.modal .btns button{flex:1}

/* 화 섬 화면 */
#s-island{background:#e8f3ef}
.wrapIsl{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#islMsg{padding:10px 14px;font-size:13px;min-height:2.6em;line-height:1.4}

@media (min-width:800px){.infoBox{max-width:720px;margin:0 auto 12px;width:calc(100% - 24px)}}
</style>
</head>
<body>

<!-- 타이틀 -->
<section id="s-start" class="screen on">
  <div class="title-box">
    <div class="logo">
      <i style="background:#5fae6a">木</i><i style="background:#e8786a">火</i><i style="background:#c99a63">土</i>
      <i style="background:#9aa7b4">金</i><i style="background:#4d9fd6">水</i>
    </div>
    <h1>오행의 집 GAME</h1>
    <p>다섯 섬 중 하나에서 나만의 집을 꾸며보세요</p>
    <button id="btnStart">GAME START</button>
  </div>
</section>

<!-- 섬 선택 -->
<section id="s-select" class="screen">
  <div class="head">
    <button id="btnSelBack" class="ghost">←</button>
    <h2>섬 고르기</h2>
  </div>
  <div class="mapArea"><div class="stage" id="stage"></div></div>
  <div class="infoBox" id="info">섬을 누르면 지형과 집터 정보가 나와요.</div>
  <div class="foot"><button id="btnGo" disabled>이 섬에서 살기</button></div>
  <div class="modal" id="confirm">
    <div class="box">
      <p>이 섬으로 선택하겠습니까?</p>
      <div class="btns">
        <button id="btnYes">예</button>
        <button id="btnNo" class="ghost">아니오</button>
      </div>
    </div>
  </div>
</section>

<!-- 화 섬 화면 -->
<section id="s-island" class="screen">
  <div class="head">
    <button id="btnBack" class="ghost">← 섬 고르기</button>
    <h2 id="islName"></h2>
  </div>
  <div class="wrapIsl"><canvas id="cv"></canvas></div>
  <div id="islMsg"></div>
</section>

<script>
/* =====================================================
   1. DATA: 이미지 경로, 섬 정보
   ===================================================== */
const IMG = {
  island: 'assets/islands/hwa.png',     // 화 섬 바닥 (1024×768 투명 PNG)
  mask:   'assets/fire/walk-mask.png',  // 걷기 마스크 (흰색=걷기 가능). 없으면 알파값으로 대체
  down:   'assets/char/idle-down.png',  // 정면 대기
  back:   'assets/char/idle-back.png',  // 뒷모습 대기
  left:   'assets/char/walk-left-1.png',// 왼쪽 (오른쪽은 반전)
  bg:     'assets/bg-sea.png'           // 배경
};
const MAP_W = 1024, MAP_H = 768;        // 섬 이미지 기준 좌표계
const BLOCKED = [];                     // 마스크가 없을 때만 쓰는 막힌 사각형 [x,y,w,h]
const CHAR_H_RATIO = 0.27;              // 캐릭터 높이 = 화면 높이의 27%

const ISLANDS = [
  { id:'geum', el:'금', hanja:'金', name:'은빛봉우리 섬', img:'assets/islands/geum.png', color:'#c4ccd6',
    bbox:{x:29,y:1,w:38,h:52},
    terrain:'흰 바위 봉우리 세 개와 그 아래 펼쳐진 돌빛 평지',
    plots:'집터 3곳 (봉우리 아래 평지, 봉우리 사이, 돌빛 가장자리)' },
  { id:'hwa', el:'화', hanja:'火', name:'붉은절벽 섬', img:'assets/islands/hwa.png', color:'#d9906f',
    bbox:{x:6,y:14,w:28,h:80},
    terrain:'한쪽으로 길게 이어지는 붉은 절벽과 아래쪽의 따뜻한 빛깔 들판',
    plots:'집터 2곳 (절벽 위 전망 터, 들판 입구 터)' },
  { id:'to', el:'토', hanja:'土', name:'황금들판 섬', img:'assets/islands/to.png', color:'#e0b458',
    bbox:{x:36,y:31,w:28,h:40},
    terrain:'뒤쪽의 둥근 언덕 두 개와 지도에서 가장 넓은 평원',
    plots:'집터 4곳 (평원 중심, 언덕 아래, 길가, 들판 끝)' },
  { id:'su', el:'수', hanja:'水', name:'물굽이 섬', img:'assets/islands/su.png', color:'#8fc3c9',
    bbox:{x:62,y:6,w:26,h:86},
    terrain:'작은 만으로 이어지는 굽은 강과 강 안쪽의 넓은 풀밭',
    plots:'집터 2곳 (강가 터, 풀밭 터)' },
  { id:'mok', el:'목', hanja:'木', name:'풀빛언덕 섬', img:'assets/islands/mok.png', color:'#a9d98f',
    bbox:{x:33,y:68,w:34,h:24},
    terrain:'층층이 이어지는 낮은 언덕과 한가운데의 열린 들판',
    plots:'집터 3곳 (언덕 계단 터, 들판 터, 숲 가장자리 터)' }
];
const byId = id => ISLANDS.find(i => i.id === id) || null;

const Store = {
  getIsland() { return localStorage.getItem('ohaeng-island') || ''; },
  setIsland(id) { try { localStorage.setItem('ohaeng-island', id); } catch (e) {} }
};

/* =====================================================
   2. WORLD: 마스크 로드와 걷기 판정 (이동은 다음 단계)
   ===================================================== */
const World = {
  walk: null,      // 픽셀마다 1 = 걸을 수 있음, 0 = 막힘
  usedMask: false,
  async build(islImg) {
    const maskImg = await loadImg(IMG.mask);
    const c = document.createElement('canvas');
    c.width = MAP_W; c.height = MAP_H;
    const g = c.getContext('2d', { willReadFrequently: true });
    const walk = new Uint8Array(MAP_W * MAP_H);
    if (maskImg) {
      g.drawImage(maskImg, 0, 0, MAP_W, MAP_H);
      const d = g.getImageData(0, 0, MAP_W, MAP_H).data;
      for (let i = 0; i < walk.length; i++) walk[i] = d[i * 4] > 128 ? 1 : 0;
      this.usedMask = true;
    } else if (islImg) {
      g.drawImage(islImg, 0, 0, MAP_W, MAP_H);
      const d = g.getImageData(0, 0, MAP_W, MAP_H).data;
      for (let i = 0; i < walk.length; i++) walk[i] = d[i * 4 + 3] > 0 ? 1 : 0;
      for (const [x, y, w, h] of BLOCKED)
        for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++)
          if (xx >= 0 && yy >= 0 && xx < MAP_W && yy < MAP_H) walk[yy * MAP_W + xx] = 0;
      this.usedMask = false;
    }
    this.walk = walk;
  },
  ok(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    return x >= 0 && y >= 0 && x < MAP_W && y < MAP_H && !!this.walk && this.walk[y * MAP_W + x] === 1;
  },
  // 섬 중앙에서 가장 가까운 걸을 수 있는 칸 (시작 위치)
  findStart() {
    const cx = MAP_W / 2, cy = MAP_H / 2;
    for (let r = 0; r <= 400; r += 4)
      for (let dy = -r; dy <= r; dy += 4)
        for (let dx = -r; dx <= r; dx += 4)
          if (this.ok(cx + dx, cy + dy)) return { x: cx + dx, y: cy + dy };
    return { x: cx, y: cy };
  }
};

function loadImg(src) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

/* =====================================================
   3. PLAYER & ASSETS: 캐릭터 상태와 이미지 캐시
   ===================================================== */
const Player = { x: 0, y: 0, dir: 'down' };
const Assets = { ready: false, island: null, bg: null, sprites: {} };

async function loadAssets() {
  if (Assets.ready) return;
  Assets.island = await loadImg(IMG.island);
  Assets.bg = await loadImg(IMG.bg);
  Assets.sprites.down = await loadImg(IMG.down);
  Assets.sprites.back = await loadImg(IMG.back);
  Assets.sprites.left = await loadImg(IMG.left);
  await World.build(Assets.island);
  Assets.ready = true;
}

function spriteFor(dir) {
  if (dir === 'up') return { img: Assets.sprites.back, flip: false };
  if (dir === 'left') return { img: Assets.sprites.left, flip: false };
  if (dir === 'right') return { img: Assets.sprites.left, flip: true };
  return { img: Assets.sprites.down, flip: false };
}

/* =====================================================
   4. RENDER: 캔버스 그리기
   ===================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const View = { s: 1, ox: 0, oy: 0, w: 0, h: 0 };

// 캔버스 크기와 섬 배치(비율 유지, 중앙) 계산
function layout() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  View.w = r.width; View.h = r.height;
  View.s = Math.min(r.width / MAP_W, r.height / MAP_H);
  View.ox = (r.width - MAP_W * View.s) / 2;
  View.oy = (r.height - MAP_H * View.s) / 2;
}

function draw() {
  const { w, h, s, ox, oy } = View;
  if (!w || !h) return;
  ctx.clearRect(0, 0, w, h);

  // 배경: 화면을 덮도록 중앙 맞춤, 없으면 단색
  const bg = Assets.bg;
  if (bg) {
    const k = Math.max(w / bg.naturalWidth, h / bg.naturalHeight);
    const bw = bg.naturalWidth * k, bh = bg.naturalHeight * k;
    ctx.drawImage(bg, (w - bw) / 2, (h - bh) / 2, bw, bh);
  } else {
    ctx.fillStyle = '#c9e7f2';
    ctx.fillRect(0, 0, w, h);
  }

  // 섬 바닥
  if (Assets.island) ctx.drawImage(Assets.island, ox, oy, MAP_W * s, MAP_H * s);
  else { ctx.fillStyle = '#d9906f'; ctx.fillRect(ox, oy, MAP_W * s, MAP_H * s); }

  // 캐릭터: 발 위치 기준, 높이 27%
  const fx = ox + Player.x * s, fy = oy + Player.y * s;
  const chH = h * CHAR_H_RATIO;
  const { img, flip } = spriteFor(Player.dir);
  const chW = img ? chH * img.naturalWidth / img.naturalHeight : chH * 0.7;

  // 발 아래 타원 그림자
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath();
  ctx.ellipse(fx, fy, chW * 0.6, chH * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();

  if (img) {
    ctx.save();
    ctx.translate(fx, fy);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(img, -chW / 2, -chH, chW, chH);
    ctx.restore();
  } else {
    // 이미지가 없을 때 대체 도형
    ctx.fillStyle = '#e8786a';
    ctx.beginPath();
    ctx.arc(fx, fy - chH / 2, chH / 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* =====================================================
   5. 섬 선택 UI (이전 단계와 동일)
   - hover: 마우스가 섬 위에 있는 동안만 커짐
   - press: 누르고 있거나 드래그 중인 섬이 커짐
   - on:    선택된 섬은 커진 상태 유지
   - 라벨: 실제 이미지 윗면 바로 위에 배치
   ===================================================== */
let pick = null, down = false, under = null;

function placeLabel(el) {
  const img = el.querySelector('img');
  const lab = el.querySelector('.label');
  if (!img || !lab || !img.naturalWidth) return;
  const bw = el.clientWidth, bh = el.clientHeight;
  if (!bw || !bh) return;
  const scale = Math.min(bw / img.naturalWidth, bh / img.naturalHeight);
  const drawnH = img.naturalHeight * scale;
  const imgTop = (bh - drawnH) / 2;
  lab.style.top = (imgTop - lab.offsetHeight - 4) + 'px';
}
function placeAllLabels() { document.querySelectorAll('.isl').forEach(placeLabel); }

function buildStage() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  ISLANDS.forEach(isl => {
    const b = isl.bbox;
    const el = document.createElement('div');
    el.className = 'isl';
    el.dataset.id = isl.id;
    el.style.left = b.x + '%';
    el.style.top = b.y + '%';
    el.style.width = b.w + '%';
    el.style.height = b.h + '%';
    el.innerHTML = `<img src="${isl.img}" alt="${isl.el} ${isl.name}"><span class="label">${isl.el}(${isl.hanja}) · ${isl.name}</span>`;
    const img = el.querySelector('img');
    img.addEventListener('load', () => placeLabel(el));
    img.addEventListener('error', () => {               // 이미지가 없으면 색 도형으로 대체
      img.style.visibility = 'hidden';
      el.style.background = isl.color;
      el.style.borderRadius = '50%';
    });
    el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') el.classList.add('hover'); });
    el.addEventListener('pointerleave', () => el.classList.remove('hover'));
    stage.appendChild(el);
  });
  refreshSelected();
  placeAllLabels();
}

function refreshSelected() {
  document.querySelectorAll('.isl').forEach(el => {
    el.classList.toggle('on', !!pick && el.dataset.id === pick.id);
  });
}
function setPress(el) {
  document.querySelectorAll('.isl.press').forEach(e => e.classList.remove('press'));
  if (el) el.classList.add('press');
}

const stageEl = document.getElementById('stage');
stageEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.isl');
  if (!el) return;
  down = true; under = el; setPress(el);
});
window.addEventListener('pointermove', e => {
  if (!down) return;
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('.isl') || null;
  if (el !== under) { under = el; setPress(el); }
});
window.addEventListener('pointerup', () => {
  if (!down) return;
  down = false;
  const target = under;
  under = null; setPress(null);
  if (target) selectIsland(byId(target.dataset.id));
});
window.addEventListener('pointercancel', () => { down = false; under = null; setPress(null); });

if (window.ResizeObserver) new ResizeObserver(placeAllLabels).observe(stageEl);

function selectIsland(isl) {
  if (!isl) return;
  pick = isl;
  refreshSelected();
  document.getElementById('btnGo').disabled = false;
  showInfo(isl);
}

// 선택 전: 라벨만. 선택 후: 지형과 집터 정보
function showInfo(isl) {
  const info = document.getElementById('info');
  if (!isl) { info.innerHTML = '섬을 누르면 지형과 집터 정보가 나와요.'; return; }
  info.innerHTML =
    `<h3>${isl.el}(${isl.hanja}) · ${isl.name}</h3>` +
    `<p><b>지형</b>: ${isl.terrain}</p><p><b>집터</b>: ${isl.plots}</p>`;
}

/* =====================================================
   6. UI: 화면 전환과 입장
   ===================================================== */
const $ = id => document.getElementById(id);
const screens = { start: $('s-start'), select: $('s-select'), island: $('s-island') };
function show(name) {
  Object.values(screens).forEach(s => s.classList.remove('on'));
  screens[name].classList.add('on');
}

async function enterIsland(target) {
  if (target.id !== 'hwa') {
    $('info').innerHTML = '<p>이번 단계에서는 화 섬만 들어갈 수 있어요.</p>';
    return;
  }
  Store.setIsland(target.id);
  $('islName').textContent = `${target.el}(${target.hanja}) · ${target.name}`;
  show('island');
  $('islMsg').textContent = '';
  await loadAssets();
  const start = World.findStart();
  Player.x = start.x; Player.y = start.y; Player.dir = 'down';
  layout();
  draw();
  $('islMsg').textContent = World.usedMask
    ? '걷기 마스크를 불러왔어요.'
    : '걷기 마스크가 없어 섬 이미지의 알파값으로 판정하고 있어요.';
}

$('btnStart').onclick = () => {
  show('select');
  buildStage();
  showInfo(pick);
  $('btnGo').disabled = !pick;
};
$('btnSelBack').onclick = () => show('start');
$('btnGo').onclick = () => { if (pick) $('confirm').classList.add('on'); };
$('btnNo').onclick = () => $('confirm').classList.remove('on');
$('btnYes').onclick = () => {
  $('confirm').classList.remove('on');
  if (pick) enterIsland(pick);
};
$('btnBack').onclick = () => {
  show('select');
  buildStage();
  showInfo(pick);
  $('btnGo').disabled = !pick;
};

window.addEventListener('resize', () => {
  if (screens.island.classList.contains('on')) { layout(); draw(); }
});

(function restoreChoice() {
  pick = byId(Store.getIsland());
})();
</script>
</body>
</html>
