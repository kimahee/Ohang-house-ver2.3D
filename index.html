<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오행의 집 GAME</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#2d2a3a;background:#20323a}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:#dfeeee url('assets/bg-sea.png') center/cover no-repeat}
.screen.on{display:flex}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;min-height:44px;background:#2d2a3a;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#2d2a3a;box-shadow:inset 0 0 0 2px #2d2a3a}
button:disabled{opacity:.4;cursor:default}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.7)}
.head h2{flex:1;font-size:17px}
.head button{padding:8px 12px;min-height:38px;font-size:13px}

/* 타이틀 */
#s-start{align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px}
.title-box{background:rgba(255,255,255,.6);border-radius:24px;padding:26px 22px}
.logo{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.logo i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900}
#s-start h1{font-size:30px;font-weight:900}
#s-start p{font-size:14px;color:#4b4658;margin-top:6px}
#btnStart{font-size:18px;padding:16px 36px;background:#c0392b;margin-top:18px}

/* 섬 선택 */
.mapArea{flex:1;min-height:0;position:relative;overflow:hidden}
.stage{position:absolute;inset:0}
.isl{position:absolute;cursor:pointer;transition:transform .2s ease,filter .2s ease;transform-origin:50% 60%;touch-action:none;user-select:none;-webkit-user-select:none}
.isl img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;display:block}
.isl.hover{transform:scale(1.15);z-index:5}
.isl.on,.isl.press{transform:scale(1.2);z-index:6;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.label{position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;pointer-events:none;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.isl.on .label,.isl.press .label{background:#2d2a3a;color:#fff}
.infoBox{margin:0 12px;background:#fff;border-radius:16px;padding:12px 14px;min-height:96px;font-size:14px;line-height:1.55;color:#4b4658}
.infoBox h3{font-size:17px;color:#2d2a3a;margin-bottom:6px}
.foot{padding:12px}
.foot button{width:100%}
.modal{position:absolute;inset:0;background:rgba(20,16,30,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:18px;padding:22px 18px;text-align:center;max-width:340px;width:100%}
.modal p{font-size:16px;font-weight:800;margin-bottom:16px}
.modal .btns{display:flex;gap:10px}
.modal .btns button{flex:1}

/* 섬 화면: 캔버스가 화면 전체 */
#s-island{background:#bfe3f2}
.wrapIsl{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#islMsg{position:absolute;left:10px;right:10px;bottom:10px;font-size:13px;color:#2d2a3a;background:rgba(255,255,255,.85);border-radius:12px;padding:8px 12px;pointer-events:none;min-height:2.4em}

@media (min-width:800px){.infoBox{max-width:720px;margin:0 auto 12px;width:calc(100% - 24px)}}
</style>
</head>
<body>

<!-- 타이틀 -->
<section id="s-start" class="screen on">
  <div class="title-box">
    <div class="logo">
      <i style="background:#5fae6a">木</i><i style="background:#e8786a">火</i><i style="background:#c99a63">土</i>
      <i style="background:#9aa7b4">金</i><i style="background:#4d9fd6">水</i>
    </div>
    <h1>오행의 집 GAME</h1>
    <p>다섯 섬 중 하나에서 나만의 집을 꾸며보세요</p>
    <button id="btnStart">GAME START</button>
  </div>
</section>

<!-- 섬 선택 -->
<section id="s-select" class="screen">
  <div class="head">
    <button id="btnSelBack" class="ghost">←</button>
    <h2>섬 고르기</h2>
  </div>
  <div class="mapArea"><div class="stage" id="stage"></div></div>
  <div class="infoBox" id="info">섬을 누르면 지형과 집터 정보가 나와요.</div>
  <div class="foot"><button id="btnGo" disabled>이 섬에서 살기</button></div>
  <div class="modal" id="confirm">
    <div class="box">
      <p>이 섬으로 선택하겠습니까?</p>
      <div class="btns">
        <button id="btnYes">예</button>
        <button id="btnNo" class="ghost">아니오</button>
      </div>
    </div>
  </div>
</section>

<!-- 섬 화면 -->
<section id="s-island" class="screen">
  <div class="head">
    <button id="btnBack" class="ghost">← 섬 고르기</button>
    <h2 id="islName"></h2>
  </div>
  <div class="wrapIsl">
    <canvas id="cv"></canvas>
    <div id="islMsg"></div>
  </div>
</section>

<script>
/* =====================================================
   1. DATA: 경로, 월드 크기, 섬 정보
   - 화면 위 1/3은 하늘(고정), 아래 2/3은 땅(월드 좌표로 스크롤)
   - 월드 좌표 1600×1200 기준. 섬 이미지는 월드 전체에 깔림
   ===================================================== */
const $ = id => document.getElementById(id);

const IMG = {
  mask: 'assets/fire/walk-mask.png',     // 화 섬 걷기 마스크 (흰색=걷기 가능). 없으면 알파값 사용
  down: 'assets/char/idle-down.png',     // 정면 대기
  back: 'assets/char/idle-back.png',     // 뒷모습 대기
  left: 'assets/char/walk-left-1.png',   // 왼쪽 (오른쪽은 반전)
  bg:   'assets/bg-sea.png'              // 하늘 배경
};
const WORLD = 1600, WORLD_H = 1200;      // 땅 월드 크기 (월드 px)
const GRID = 4;                          // 걷기 판정 격자 한 칸 = 월드 4px
const CHAR_H = 110;                      // 캐릭터 높이 (월드 px)
const WALK = 300;                        // 이동 속도 (월드 px/초)
const HORIZON = 1 / 3;                   // 하늘 비율 (화면 높이의 1/3)

const ISLANDS = [
  { id:'geum', el:'금', hanja:'金', name:'은빛봉우리 섬', img:'assets/islands/geum.png', color:'#c9c2a8',
    bbox:{x:29,y:1,w:38,h:52},
    terrain:'흰 바위 봉우리 세 개와 그 아래 펼쳐진 돌빛 평지',
    plots:'집터 3곳 (봉우리 아래 평지, 봉우리 사이, 돌빛 가장자리)' },
  { id:'hwa', el:'화', hanja:'火', name:'붉은절벽 섬', img:'assets/islands/hwa.png', color:'#d9a07a',
    bbox:{x:6,y:14,w:28,h:80},
    terrain:'한쪽으로 길게 이어지는 붉은 절벽과 아래쪽의 따뜻한 빛깔 들판',
    plots:'집터 2곳 (절벽 위 전망 터, 들판 입구 터)' },
  { id:'to', el:'토', hanja:'土', name:'황금들판 섬', img:'assets/islands/to.png', color:'#d8b766',
    bbox:{x:36,y:31,w:28,h:40},
    terrain:'뒤쪽의 둥근 언덕 두 개와 지도에서 가장 넓은 평원',
    plots:'집터 4곳 (평원 중심, 언덕 아래, 길가, 들판 끝)' },
  { id:'su', el:'수', hanja:'水', name:'물굽이 섬', img:'assets/islands/su.png', color:'#9ccfc4',
    bbox:{x:62,y:6,w:26,h:86},
    terrain:'작은 만으로 이어지는 굽은 강과 강 안쪽의 넓은 풀밭',
    plots:'집터 2곳 (강가 터, 풀밭 터)' },
  { id:'mok', el:'목', hanja:'木', name:'풀빛언덕 섬', img:'assets/islands/mok.png', color:'#b5d98f',
    bbox:{x:33,y:68,w:34,h:24},
    terrain:'층층이 이어지는 낮은 언덕과 한가운데의 열린 들판',
    plots:'집터 3곳 (언덕 계단 터, 들판 터, 숲 가장자리 터)' }
];
const byId = id => ISLANDS.find(i => i.id === id) || null;

const Store = {
  getIsland() { return localStorage.getItem('ohaeng-island') || ''; },
  setIsland(id) { try { localStorage.setItem('ohaeng-island', id); } catch (e) {} },
  getPos(id) { try { return JSON.parse(localStorage.getItem('ohaeng-pos-' + id)); } catch (e) { return null; } },
  setPos(id, p) { try { localStorage.setItem('ohaeng-pos-' + id, JSON.stringify(p)); } catch (e) {} }
};

/* =====================================================
   2. ASSETS: 이미지 로드 (실패 시 목록에 기록하고 색 도형으로 대체)
   ===================================================== */
const missing = [];
function loadImg(src) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => { missing.push(src); res(null); };
    i.src = src;
  });
}
const Assets = { isl: null, mask: null, bg: null, down: null, back: null, left: null };

/* =====================================================
   3. WORLD: 걷기 판정 격자 (마스크 우선, 없으면 섬 알파값)
   ===================================================== */
const Walk = {
  grid: null, gw: 0, gh: 0,
  build(islImg, maskImg) {
    this.gw = WORLD / GRID; this.gh = WORLD_H / GRID;
    const c = document.createElement('canvas');
    c.width = this.gw; c.height = this.gh;
    const g = c.getContext('2d', { willReadFrequently: true });
    const grid = new Uint8Array(this.gw * this.gh);
    if (maskImg) {
      g.drawImage(maskImg, 0, 0, this.gw, this.gh);
      const d = g.getImageData(0, 0, this.gw, this.gh).data;
      for (let i = 0; i < grid.length; i++) grid[i] = d[i * 4] > 128 ? 1 : 0;
    } else if (islImg) {
      g.drawImage(islImg, 0, 0, this.gw, this.gh);
      const d = g.getImageData(0, 0, this.gw, this.gh).data;
      for (let i = 0; i < grid.length; i++) grid[i] = d[i * 4 + 3] > 64 ? 1 : 0;
    } else {
      grid.fill(1);   // 이미지가 전혀 없으면 막지 않음
    }
    this.grid = grid;
  },
  ok(x, y) {
    const gx = Math.floor(x / GRID), gy = Math.floor(y / GRID);
    return gx >= 0 && gy >= 0 && gx < this.gw && gy < this.gh && this.grid[gy * this.gw + gx] === 1;
  },
  // 발 끝 주변 4점이 모두 걸을 수 있어야 통과
  can(x, y) { return this.ok(x - 6, y) && this.ok(x + 6, y) && this.ok(x, y - 4) && this.ok(x, y + 4); },
  // 중앙에서 가장 가까운 걸을 수 있는 지점
  findStart() {
    const cx = WORLD / 2, cy = WORLD_H / 2;
    for (let r = 0; r < 800; r += 8)
      for (let dy = -r; dy <= r; dy += 8)
        for (let dx = -r; dx <= r; dx += 8)
          if (this.can(cx + dx, cy + dy)) return { x: cx + dx, y: cy + dy };
    return { x: cx, y: cy };
  }
};

/* =====================================================
   4. PLAYER: 캐릭터 상태, 입력, 이동
   ===================================================== */
const P = { x: WORLD / 2, y: WORLD_H / 2, dir: 'down', moving: false };
let cur = null;                    // 현재 섬
let target = null;                 // 터치/클릭 목표 (월드 좌표)
const keys = {};
const KEYMAP = { KeyW:'u', ArrowUp:'u', KeyS:'d', ArrowDown:'d', KeyA:'l', ArrowLeft:'l', KeyD:'r', ArrowRight:'r' };
let deco = [];                     // 땅 위 풀 무늬 (월드 좌표, 걸을 수 있는 곳만)

window.addEventListener('keydown', e => {
  if (!screens.island.classList.contains('on')) return;
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; target = null; e.preventDefault(); }
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function spriteFor(dir) {
  if (dir === 'up') return { img: Assets.back, flip: false };
  if (dir === 'left') return { img: Assets.left, flip: false };
  if (dir === 'right') return { img: Assets.left, flip: true };
  return { img: Assets.down, flip: false };
}

function update(dt) {
  let dx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), dy = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  if (dx || dy) {
    target = null;
    const n = Math.hypot(dx, dy); dx /= n; dy /= n;      // 대각선 속도 보정
  } else if (target) {
    const tx = target.x - P.x, ty = target.y - P.y, d = Math.hypot(tx, ty);
    if (d < 4) target = null; else { dx = tx / d; dy = ty / d; }
  }
  const sp = WALK * dt, ox = P.x, oy = P.y;
  if (dx || dy) {
    const nx = P.x + dx * sp, ny = P.y + dy * sp;
    if (Walk.can(nx, P.y)) P.x = nx;                 // 축별로 검사: 벽을 따라 미끄러짐
    if (Walk.can(P.x, ny)) P.y = ny;
    if (Math.abs(dx) > Math.abs(dy)) P.dir = dx < 0 ? 'left' : 'right';
    else P.dir = dy < 0 ? 'up' : 'down';
  }
  P.moving = P.x !== ox || P.y !== oy;
  if (target && !P.moving) target = null;            // 막히면 목표 취소
}

/* =====================================================
   5. RENDER: 하늘 1/3 고정, 땅 2/3 스크롤
   ===================================================== */
const cv = $('cv');
const ctx = cv.getContext('2d');
const View = { w: 0, h: 0, hz: 0, gh: 0, z: 1, cx: 0, cy: 0 };

function layout() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  View.w = r.width; View.h = r.height;
  View.hz = Math.round(r.height * HORIZON);     // 하늘 영역 높이
  View.gh = r.height - View.hz;                 // 땅 영역 높이 (2/3)
  // 화면 크기에 따라 캐릭터·땅 배율 결정 (모바일은 작게, 데스크톱은 크게)
  View.z = Math.max(0.45, Math.min(1.6, Math.min(r.width / 640, View.gh / 480)));
}

function drawCover(img, x, y, w, h) {
  const k = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
  ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
}

function drawSky() {
  const { w, hz } = View;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, w, hz); ctx.clip();
  if (Assets.bg) drawCover(Assets.bg, 0, 0, w, hz);
  else {
    const g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#9fd8ef'); g.addColorStop(1, '#fff6dc');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, hz);
  }
  ctx.restore();
}

function drawGround() {
  const { w, h, hz, gh, z } = View;
  // 카메라: 캐릭터를 땅 영역 중앙에 두되, 월드 가장자리 밖은 보이지 않게 제한
  const halfW = w / (2 * z), halfH = gh / (2 * z);
  let cx = WORLD / 2, cy = WORLD_H / 2;
  if (WORLD > 2 * halfW) cx = Math.min(WORLD - halfW, Math.max(halfW, P.x));
  if (WORLD_H > 2 * halfH) cy = Math.min(WORLD_H - halfH, Math.max(halfH, P.y));
  View.cx = cx; View.cy = cy;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, hz, w, gh); ctx.clip();
  ctx.translate(w / 2, hz + gh / 2);
  ctx.scale(z, z);
  ctx.translate(-cx, -cy);

  // 땅 바탕 → 섬 이미지 → 풀 무늬
  ctx.fillStyle = cur ? cur.color : '#d9a07a';
  ctx.fillRect(0, 0, WORLD, WORLD_H);
  if (Assets.isl) ctx.drawImage(Assets.isl, 0, 0, WORLD, WORLD_H);
  ctx.fillStyle = 'rgba(70,130,60,.28)';
  for (const d of deco) { ctx.fillRect(d.x, d.y, 3, 7); ctx.fillRect(d.x + 5, d.y + 2, 3, 6); }

  // 캐릭터 (발 위치 기준)
  drawPlayer();
  ctx.restore();

  // 땅 위쪽 경계에 옅은 그림자 (하늘과 땅을 구분)
  const g = ctx.createLinearGradient(0, hz, 0, hz + 14);
  g.addColorStop(0, 'rgba(0,0,0,.18)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, hz, w, 14);
}

function drawPlayer() {
  const { img, flip } = spriteFor(P.dir);
  const h = CHAR_H;
  const w = img ? h * img.naturalWidth / img.naturalHeight : h * 0.8;
  const bob = P.moving ? Math.abs(Math.sin(performance.now() / 110)) * 4 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(P.x, P.y, h * .32, h * .1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(P.x, P.y - bob);
  if (flip) ctx.scale(-1, 1);
  if (img) ctx.drawImage(img, -w / 2, -h, w, h);
  else {                                         // 이미지가 없으면 대체 도형
    ctx.fillStyle = '#e8786a';
    ctx.beginPath(); ctx.arc(0, -h / 2, h / 2.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function draw() {
  if (!View.w) return;
  ctx.clearRect(0, 0, View.w, View.h);
  drawSky();
  drawGround();
}

/* =====================================================
   6. SELECT UI: 섬 선택 (이전 단계와 동일)
   ===================================================== */
let pick = null, down = false, under = null;

function placeLabel(el) {
  const img = el.querySelector('img'), lab = el.querySelector('.label');
  if (!img || !lab || !img.naturalWidth) return;
  const bw = el.clientWidth, bh = el.clientHeight;
  if (!bw || !bh) return;
  const scale = Math.min(bw / img.naturalWidth, bh / img.naturalHeight);
  lab.style.top = ((bh - img.naturalHeight * scale) / 2 - lab.offsetHeight - 4) + 'px';
}
function placeAllLabels() { document.querySelectorAll('.isl').forEach(placeLabel); }

function buildStage() {
  const stage = $('stage');
  stage.innerHTML = '';
  ISLANDS.forEach(isl => {
    const b = isl.bbox;
    const el = document.createElement('div');
    el.className = 'isl';
    el.dataset.id = isl.id;
    el.style.left = b.x + '%'; el.style.top = b.y + '%';
    el.style.width = b.w + '%'; el.style.height = b.h + '%';
    el.innerHTML = `<img src="${isl.img}" alt="${isl.el} ${isl.name}"><span class="label">${isl.el}(${isl.hanja}) · ${isl.name}</span>`;
    el.querySelector('img').addEventListener('load', () => placeLabel(el));
    el.querySelector('img').addEventListener('error', () => {
      el.querySelector('img').style.visibility = 'hidden';
      el.style.background = isl.color; el.style.borderRadius = '50%';
    });
    el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') el.classList.add('hover'); });
    el.addEventListener('pointerleave', () => el.classList.remove('hover'));
    stage.appendChild(el);
  });
  refreshSelected();
  placeAllLabels();
}
function refreshSelected() {
  document.querySelectorAll('.isl').forEach(el => el.classList.toggle('on', !!pick && el.dataset.id === pick.id));
}
function setPress(el) {
  document.querySelectorAll('.isl.press').forEach(e => e.classList.remove('press'));
  if (el) el.classList.add('press');
}
const stageEl = $('stage');
stageEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.isl');
  if (!el) return;
  down = true; under = el; setPress(el);
});
window.addEventListener('pointermove', e => {
  if (!down) return;
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('.isl') || null;
  if (el !== under) { under = el; setPress(el); }
});
window.addEventListener('pointerup', () => {
  if (!down) return;
  down = false;
  const t = under; under = null; setPress(null);
  if (t) selectIsland(byId(t.dataset.id));
});
window.addEventListener('pointercancel', () => { down = false; under = null; setPress(null); });
if (window.ResizeObserver) new ResizeObserver(placeAllLabels).observe(stageEl);

function selectIsland(isl) {
  if (!isl) return;
  pick = isl;
  refreshSelected();
  $('btnGo').disabled = false;
  showInfo(isl);
}
function showInfo(isl) {
  if (!isl) { $('info').innerHTML = '섬을 누르면 지형과 집터 정보가 나와요.'; return; }
  $('info').innerHTML = `<h3>${isl.el}(${isl.hanja}) · ${isl.name}</h3><p><b>지형</b>: ${isl.terrain}</p><p><b>집터</b>: ${isl.plots}</p>`;
}

/* =====================================================
   7. UI: 화면 전환, 섬 입장, 루프
   ===================================================== */
const screens = { start: $('s-start'), select: $('s-select'), island: $('s-island') };
function show(name) {
  Object.values(screens).forEach(s => s.classList.remove('on'));
  screens[name].classList.add('on');
}

async function enterIsland(isl) {
  cur = isl;
  Store.setIsland(isl.id);
  $('islName').textContent = `${isl.el}(${isl.hanja}) · ${isl.name}`;
  show('island');
  $('islMsg').textContent = '이미지를 불러오는 중…';
  missing.length = 0;

  const [islImg, mask, bg, down_, back, left] = await Promise.all([
    isl.img ? loadImg(isl.img) : null,
    isl.id === 'hwa' ? loadImg(IMG.mask) : null,
    loadImg(IMG.bg), loadImg(IMG.down), loadImg(IMG.back), loadImg(IMG.left)
  ]);
  Object.assign(Assets, { isl: islImg, mask, bg, down: down_, back, left });
  Walk.build(islImg, mask);

  // 저장된 위치가 있으면 복원, 없거나 걸을 수 없으면 중앙 근처
  const saved = Store.getPos(isl.id);
  const start = saved && Walk.can(saved.x, saved.y) ? saved : Walk.findStart();
  P.x = start.x; P.y = start.y; P.dir = 'down'; P.moving = false;
  target = null;

  // 땅 위 풀 무늬: 걸을 수 있는 곳에만
  deco = [];
  for (let i = 0, tries = 0; deco.length < 240 && tries < 4000; tries++) {
    const x = Math.random() * WORLD, y = Math.random() * WORLD_H;
    if (Walk.ok(x, y)) deco.push({ x, y });
  }

  layout(); draw();
  const bad = missing.filter(p => p !== IMG.mask);
  $('islMsg').textContent = bad.length
    ? '불러오지 못한 이미지: ' + bad.join(', ') + ' (경로 확인)'
    : '화면을 누르거나 WASD·방향키로 걸어 보세요.';
}

// 땅 터치/클릭 → 월드 좌표 목표
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  if (sy < View.hz) return;                                 // 하늘은 이동 대상이 아님
  const wx = (sx - View.w / 2) / View.z + View.cx;
  const wy = (sy - (View.hz + View.gh / 2)) / View.z + View.cy;
  if (!Walk.ok(wx, wy)) { $('islMsg').textContent = '그곳은 바다나 절벽이라 걸을 수 없어요.'; return; }
  target = { x: wx, y: wy };
});

let last = 0, saveT = 0;
function loop(t) {
  const dt = Math.min(0.05, last ? (t - last) / 1000 : 0);
  last = t;
  if (cur && screens.island.classList.contains('on') && Assets.isl !== undefined && View.w) {
    update(dt);
    draw();
    saveT += dt;
    if (saveT > 0.5 && P.moving) { Store.setPos(cur.id, { x: P.x, y: P.y }); saveT = 0; }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => { if (screens.island.classList.contains('on') && cur) { layout(); draw(); } });
window.addEventListener('pagehide', () => { if (cur) Store.setPos(cur.id, { x: P.x, y: P.y }); });

$('btnStart').onclick = () => { show('select'); buildStage(); showInfo(pick); $('btnGo').disabled = !pick; };
$('btnSelBack').onclick = () => show('start');
$('btnGo').onclick = () => { if (pick) $('confirm').classList.add('on'); };
$('btnNo').onclick = () => $('confirm').classList.remove('on');
$('btnYes').onclick = () => { $('confirm').classList.remove('on'); if (pick) enterIsland(pick); };
$('btnBack').onclick = () => {
  if (cur) Store.setPos(cur.id, { x: P.x, y: P.y });
  cur = null;
  show('select'); buildStage(); showInfo(pick); $('btnGo').disabled = !pick;
};

pick = byId(Store.getIsland());
</script>
</body>
</html>
