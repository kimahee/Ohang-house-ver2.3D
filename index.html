<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오행의 집 GAME</title>
<style>
/* ===== 공통 ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#2d2a3a;background:#20323a}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:radial-gradient(circle at 50% -10%,#fff6dc,#ecd9a8 65%,#d9c08a)}
.screen.on{display:flex}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;min-height:44px;background:#2d2a3a;color:#fff;cursor:pointer}
button.ghost{background:#fff;color:#2d2a3a;box-shadow:inset 0 0 0 2px #2d2a3a}
button:disabled{opacity:.4;cursor:default}

/* ===== 시작 화면 ===== */
#s-start{align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px}
.logo{display:flex;gap:6px}
.logo i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900}
#s-start h1{font-size:30px;font-weight:900}
#btnStart{font-size:18px;padding:16px 36px;background:#c0392b}

/* ===== 섬 선택 화면 ===== */
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.7)}
.head h2{flex:1;font-size:17px}
.head button{padding:8px 12px;min-height:38px;font-size:13px}
#list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
.isl{background:#fff;border-radius:16px;padding:10px;text-align:center;cursor:pointer;border:3px solid transparent;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.isl.on{border-color:#d9a441;transform:translateY(-2px)}
.isl:last-child{grid-column:span 2}
.isl b{display:block;font-size:14px;margin-top:6px}
.isl small{font-size:12px;color:#6b6478}
.mg{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;width:100%}
.mg i{display:block;aspect-ratio:1;border-radius:2px}
.pv{margin:0 12px;background:#fff;border-radius:16px;padding:14px;flex:1;min-height:0;overflow:auto}
.pv .mini{width:150px;margin:0 auto 10px}
.pv h3{font-size:18px;margin-bottom:6px;text-align:center}
.pv p{font-size:14px;line-height:1.5;color:#4b4658;text-align:center}
.foot{padding:12px}
.foot button{width:100%}

/* ===== 섬 화면 ===== */
.wrapIsl{position:relative;flex:1;min-height:0;display:flex}
#cv{flex:1;width:100%;height:100%;display:block;touch-action:none}
#bubble{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff;padding:8px 14px;border-radius:12px;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.2);display:none;max-width:90%;text-align:center;pointer-events:none}
#islMsg{padding:10px 14px;font-size:13px;min-height:2.6em;line-height:1.4}

@media (min-width:800px){
  #list{grid-template-columns:repeat(5,1fr)}
  .isl:last-child{grid-column:auto}
  .pv{flex:none;max-width:720px;width:calc(100% - 24px);margin:0 auto 12px}
}
</style>
</head>
<body>

<!-- ===== 시작 화면 ===== -->
<section id="s-start" class="screen on">
  <div class="logo">
    <i style="background:#5fae6a">木</i><i style="background:#e8786a">火</i><i style="background:#c99a63">土</i>
    <i style="background:#9aa7b4">金</i><i style="background:#4d9fd6">水</i>
  </div>
  <h1>오행의 집 GAME</h1>
  <p style="font-size:14px;color:#6b6478">다섯 섬 중 하나에서 나만의 집을 꾸며보세요</p>
  <button id="btnStart">GAME START</button>
</section>

<!-- ===== 섬 선택 화면 ===== -->
<section id="s-select" class="screen">
  <div class="head">
    <button id="btnSelBack" class="ghost">←</button>
    <h2>섬 고르기</h2>
  </div>
  <div id="list"></div>
  <div class="pv">
    <div class="mini" id="pvMini"></div>
    <h3 id="pvName">섬을 골라주세요</h3>
    <p id="pvIntro">섬을 한 번 누르면 지형 미리보기가 나타납니다.</p>
  </div>
  <div class="foot"><button id="btnGo" disabled>이 섬에서 살기</button></div>
</section>

<!-- ===== 섬 화면 ===== -->
<section id="s-island" class="screen">
  <div class="head">
    <button id="btnBack" class="ghost">← 섬 고르기</button>
    <h2 id="islName"></h2>
  </div>
  <div class="wrapIsl">
    <canvas id="cv"></canvas>
    <div id="bubble"></div>
  </div>
  <div id="islMsg"></div>
</section>

<script>
/* =====================================================
   1. DATA: 섬 지형 (단계 A)
   . 걸을 수 있는 땅 / D 선착장(걸을 수 있음) / = 길·다리(걸을 수 있음)
   # 바위·나무(걸을 수 없음) / ~ 물·용암(걸을 수 없음) / 공백 바깥(걸을 수 없음)
   ===================================================== */
const W = 12;                         // 모든 섬의 가로 칸 수
const TILE_NAMES = {'.':'땅','D':'선착장','=':'길','#':'바위','~':'물','':'바깥'};

const ISLANDS = [
  { id:'mok', el:'목', name:'숲섬', color:'#a9d98f', dark:'#3f7a4a', water:'#7fbde0', path:'#e6d0a0',
    intro:'나무와 숲길이 둘러싼 불규칙한 공터. 바람 소리가 집의 시간을 천천히 흐르게 합니다.',
    map:[
      "  ###   ###",
      " #..=....#",
      "#...=.....#",
      "#..D=......#",
      "#.....====.#",
      "#.....=....#",
      "##....=..##",
      " #...=....#",
      "  ###...##",
      "     ###"
    ]},
  { id:'hwa', el:'화', name:'노을 화산섬', color:'#d9906f', dark:'#4b3a3d', water:'#ff6b35', path:'#b8a08f',
    intro:'붉은 암석과 어두운 화산 지형 사이의 테라스. 뜨거운 기운이 오래 머뭅니다.',
    map:[
      "   ####",
      " ##....##",
      "#..D.....#",
      "#.~~.....~#",
      "#.~~..==..#",
      "#.....====.#",
      " #..~~.....#",
      " #....=...#",
      "  ###...##",
      "    ###"
    ]},
  { id:'to', el:'토', name:'흙빛 언덕섬', color:'#c7a46b', dark:'#7a5a33', water:'#8ec5e8', path:'#e8d6b0',
    intro:'완만한 언덕과 평평한 흙마당. 넓은 땅에 천천히 집을 세우기 좋은 섬입니다.',
    map:[
      "   ......",
      " ..........",
      "...D=====...",
      "...=.......#",
      "....=....#..",
      "..........=.",
      "..###.....=.",
      "...........#",
      "  ....==....",
      "    ...."
    ]},
  { id:'geum', el:'금', name:'은빛 바위섬', color:'#c4ccd6', dark:'#5d6673', water:'#9fd0ea', path:'#dfe3e8',
    intro:'각진 암반과 돌길이 둘러싼 정원. 단정한 선을 따라 가구를 맞춰 보세요.',
    map:[
      "############",
      "#..........#",
      "#.========.#",
      "#.=......=.#",
      "#D=......=.#",
      "#.=......=.#",
      "#.========.#",
      "#..........#",
      "############"
    ]},
  { id:'su', el:'수', name:'물결섬', color:'#8fd0a6', dark:'#2f6a4a', water:'#4d9fd6', path:'#e8d6b0',
    intro:'물길과 작은 다리로 이어지는 두 개의 공터. 물결 소리를 들으며 걸어 보세요.',
    map:[
      "  ####",
      " #.D.#~~~~",
      "#.......~~~",
      "#.....===...",
      "#.....~~~...",
      "#.....~~~...",
      " #....~~....",
      "  ####  ~~"
    ]}
];

// 모든 행을 같은 폭으로 맞추고 선착장 위치를 찾음
ISLANDS.forEach(isl => {
  isl.map = isl.map.map(r => r.padEnd(W, ' ').slice(0, W));
  isl.H = isl.map.length;
  isl.dock = findDock(isl);
});
function findDock(isl) {
  for (let y = 0; y < isl.H; y++) for (let x = 0; x < W; x++)
    if (isl.map[y][x] === 'D') return {x, y};
  return {x:1, y:1};
}

/* =====================================================
   2. STORE: localStorage 저장 (단계 A: 섬별 캐릭터 위치, 현재 섬)
   ===================================================== */
const Store = {
  getIsland() { return localStorage.getItem('ohaeng-island') || ''; },
  setIsland(id) { try { localStorage.setItem('ohaeng-island', id); } catch (e) {} },
  getPos(id) {
    try { return JSON.parse(localStorage.getItem('ohaeng-pos-' + id)); } catch (e) { return null; }
  },
  setPos(id, p) {
    try { localStorage.setItem('ohaeng-pos-' + id, JSON.stringify(p)); } catch (e) {}
  },
  seenTutorial() { return localStorage.getItem('ohaeng-tut') === '1'; },
  markTutorial() { try { localStorage.setItem('ohaeng-tut', '1'); } catch (e) {} }
};

/* =====================================================
   3. WORLD: 걷기 판정, 길찾기(BFS), 캐릭터 이동
   ===================================================== */
const World = {
  walkable(isl, x, y) {
    if (x < 0 || y < 0 || x >= W || y >= isl.H) return false;
    const c = isl.map[y][x];
    return c === '.' || c === 'D' || c === '=';
  },
  // 시작 칸에서 목표 칸까지 최단 경로 (칸 좌표 배열, 시작 칸 포함). 없으면 null
  path(isl, sx, sy, tx, ty) {
    const key = (x, y) => y * W + x;
    const prev = new Map([[key(sx, sy), null]]);
    const q = [[sx, sy]];
    const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
    while (q.length) {
      const [x, y] = q.shift();
      if (x === tx && y === ty) break;
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (!this.walkable(isl, nx, ny) || prev.has(key(nx, ny))) continue;
        prev.set(key(nx, ny), [x, y]);
        q.push([nx, ny]);
      }
    }
    if (!prev.has(key(tx, ty))) return null;
    const out = [];
    let cur = [tx, ty];
    while (cur) { out.unshift(cur); cur = prev.get(key(cur[0], cur[1])); }
    return out;
  }
};

/* =====================================================
   4. SCREEN: 화면 전환
   ===================================================== */
const $ = id => document.getElementById(id);
const screens = { start: $('s-start'), select: $('s-select'), island: $('s-island') };
function show(name) {
  Object.values(screens).forEach(s => s.classList.remove('on'));
  screens[name].classList.add('on');
}

/* =====================================================
   5. 섬 선택 UI
   ===================================================== */
let pick = null;                      // 선택된 섬 (한 번 누르면 선택)
const TILE_CSS = (isl, ch) => ({
  '.':isl.color, 'D':isl.color, '=':isl.path, '#':isl.dark, '~':isl.water, ' ':'transparent'
})[ch];

function miniGrid(isl) {
  return '<div class="mg">' + isl.map.join('').split('')
    .map(ch => `<i style="background:${TILE_CSS(isl, ch)}"></i>`).join('') + '</div>';
}

function buildList() {
  const list = $('list');
  list.innerHTML = '';
  ISLANDS.forEach(isl => {
    const b = document.createElement('div');
    b.className = 'isl' + (pick && pick.id === isl.id ? ' on' : '');
    b.innerHTML = miniGrid(isl) + `<b>${isl.el === '목' ? '木' : isl.el === '화' ? '火' : isl.el === '토' ? '土' : isl.el === '금' ? '金' : '水'} · ${isl.name}</b><small>${isl.el}의 섬</small>`;
    b.onclick = () => { pick = isl; buildList(); showPreview(isl); $('btnGo').disabled = false; };
    list.appendChild(b);
  });
}
function showPreview(isl) {
  $('pvMini').innerHTML = miniGrid(isl);
  $('pvName').textContent = `${isl.el} · ${isl.name}`;
  $('pvIntro').textContent = isl.intro;
}

/* =====================================================
   6. 섬 화면: 그리기, 캐릭터 이동, 입력
   ===================================================== */
const cv = $('cv');
const ctx = cv.getContext('2d');
let isl = null;                       // 현재 섬
let T = 32, OX = 0, OY = 0;           // 칸 크기, 격자 원점(px)
let pos = {x:0, y:0};                 // 확정된 칸 위치
let px = 0, py = 0;                   // 화면에 그릴 실수 위치 (걷는 중 보간)
let route = [];                       // 남은 경로 (칸 배열)
const SPEED = 5;                      // 초당 칸 수

function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  T = Math.max(8, Math.floor(Math.min(r.width / W, r.height / isl.H)));
  OX = (r.width - T * W) / 2;
  OY = (r.height - T * isl.H) / 2;
}

function drawTile(x, y, ch) {
  const px0 = OX + x * T, py0 = OY + y * T;
  ctx.fillStyle = TILE_CSS(isl, ch);
  ctx.fillRect(px0, py0, T, T);
  ctx.strokeStyle = 'rgba(0,0,0,.06)';
  ctx.strokeRect(px0 + .5, py0 + .5, T - 1, T - 1);

  if (ch === '#' || ch === '~') {          // 걸을 수 없음: 빗금 패턴 (색 외 표시)
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.moveTo(px0, py0 + T); ctx.lineTo(px0 + T, py0);
    ctx.moveTo(px0, py0 + T * .5); ctx.lineTo(px0 + T * .5, py0);
    ctx.moveTo(px0 + T * .5, py0 + T); ctx.lineTo(px0 + T, py0 + T * .5);
    ctx.stroke();
  }
  if (ch === 'D') {                        // 선착장 표시
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(px0 + T * .2, py0 + T * .2, T * .6, T * .6);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(T * .45)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚓', px0 + T / 2, py0 + T / 2 + 1);
  }
}

function drawCharacter() {
  const cx = OX + (px + .5) * T, cy = OY + (py + .5) * T;
  const r = T * .32;
  ctx.fillStyle = 'rgba(0,0,0,.2)';            // 그림자
  ctx.beginPath(); ctx.ellipse(cx, cy + r * .9, r * .9, r * .4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe0bd';                   // 몸
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = isl.dark;                    // 오행 색 머리띠
  ctx.fillRect(cx - r, cy - r * .6, r * 2, r * .35);
  ctx.fillStyle = '#2d2a3a';                   // 눈
  ctx.beginPath(); ctx.arc(cx - r * .35, cy + r * .1, r * .1, 0, Math.PI * 2);
  ctx.arc(cx + r * .35, cy + r * .1, r * .1, 0, Math.PI * 2); ctx.fill();
}

function draw() {
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.fillStyle = '#c9e7f2';
  ctx.fillRect(0, 0, r.width, r.height);
  for (let y = 0; y < isl.H; y++) for (let x = 0; x < W; x++) {
    const ch = isl.map[y][x];
    if (ch !== ' ') drawTile(x, y, ch);
  }
  drawCharacter();
}

function loop(t) {
  if (isl && screens.island.classList.contains('on')) {
    const dt = Math.min(.05, (t - (loop.last || t)) / 1000);
    loop.last = t;
    if (route.length) {
      const [tx, ty] = route[0];
      const dx = tx - px, dy = ty - py;
      const d = Math.hypot(dx, dy);
      const step = SPEED * dt;
      if (d <= step) {
        px = tx; py = ty; route.shift();
        pos = {x:tx, y:ty};
        if (!route.length) Store.setPos(isl.id, pos);   // 도착 시 저장
      } else {
        px += dx / d * step; py += dy / d * step;
      }
    }
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function say(text) { $('islMsg').textContent = text; }

function bubble(text, ms = 3500) {
  const b = $('bubble');
  b.textContent = text;
  b.style.display = 'block';
  clearTimeout(bubble.t);
  bubble.t = setTimeout(() => b.style.display = 'none', ms);
}

// 화면을 누르면 그 칸까지 걸어감 (BFS 경로)
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left - OX) / T);
  const y = Math.floor((e.clientY - r.top - OY) / T);
  if (!World.walkable(isl, x, y)) {
    const c = (x >= 0 && y >= 0 && x < W && y < isl.H) ? isl.map[y][x] : '';
    say(`${TILE_NAMES[c] || '바깥'} 칸은 걸을 수 없어요. 땅이나 길을 눌러 주세요.`);
    return;
  }
  const sx = Math.round(px), sy = Math.round(py);
  const p = World.path(isl, sx, sy, x, y);
  if (!p) { say('그곳까지 이어지는 길이 없어요.'); return; }
  route = p.slice(1);
  if (!route.length) return;
  say('');
});

/* =====================================================
   7. 섬 입장/퇴장
   ===================================================== */
function enterIsland(target) {
  isl = target;
  Store.setIsland(isl.id);
  const saved = Store.getPos(isl.id);
  const ok = saved && World.walkable(isl, saved.x, saved.y);
  pos = ok ? {x:saved.x, y:saved.y} : {...isl.dock};
  px = pos.x; py = pos.y;
  route = [];
  $('islName').textContent = `${isl.el} · ${isl.name}`;
  show('island');
  resize();
  say('화면을 눌러 섬을 걸어 보세요.');
  if (!Store.seenTutorial()) {
    bubble('여기가 당신의 섬이에요. 집 터를 찾아 걸어 보세요!', 5000);
    Store.markTutorial();
  }
}

function leaveIsland() {
  if (isl) Store.setPos(isl.id, pos);
  show('select');
  buildList();
  if (isl) showPreview(isl);
}

/* =====================================================
   8. 이벤트 연결
   ===================================================== */
$('btnStart').onclick = () => {
  show('select');
  buildList();
  if (pick) showPreview(pick);
  $('btnGo').disabled = !pick;
};
$('btnSelBack').onclick = () => show('start');
$('btnGo').onclick = () => { if (pick) enterIsland(pick); };
$('btnBack').onclick = leaveIsland;

window.addEventListener('resize', () => {
  if (isl && screens.island.classList.contains('on')) resize();
});
window.addEventListener('pagehide', () => { if (isl) Store.setPos(isl.id, pos); });

// 새로고침 시 마지막 섬 미리 선택해 두기 (자동 입장은 하지 않음)
(function restoreChoice() {
  const id = Store.getIsland();
  pick = ISLANDS.find(i => i.id === id) || null;
})();
</script>
</body>
</html>
